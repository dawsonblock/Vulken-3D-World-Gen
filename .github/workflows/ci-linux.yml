name: CI Linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-22.04
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_binary_cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install base toolchain (gcc/g++/cmake/ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build

      - name: Install system dependencies (Vulkan, X11)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev mesa-vulkan-drivers \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            glslang-tools
          sudo apt-get install -y --no-install-recommends gcovr || true

      - name: Cache vcpkg and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/build/vcpkg_installed
            ${{ github.workspace }}/vcpkg/downloads
            ${{ github.workspace }}/vcpkg/buildtrees
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json','vcpkg-configuration.json','CMakePresets.json') }}

      - name: Bootstrap vcpkg (manifest mode)
        run: |
          set -e
          VCPKG_ROOT="${GITHUB_WORKSPACE}/vcpkg"
          # If a stray 'vcpkg' dir exists but is not a proper clone (no bootstrap script), replace it
          if [ -d "$VCPKG_ROOT" ] && [ ! -f "$VCPKG_ROOT/bootstrap-vcpkg.sh" ]; then
            echo "Found incomplete vcpkg dir at $VCPKG_ROOT (missing bootstrap). Replacing..."
            rm -rf "$VCPKG_ROOT"
          fi
          if [ ! -d "$VCPKG_ROOT" ]; then
            git clone --depth 1 https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          fi
          if [ ! -x "$VCPKG_ROOT/vcpkg" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi
          # Verify toolchain file exists
          if [ ! -f "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" ]; then
            echo "vcpkg toolchain file missing: $VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
            ls -la "$VCPKG_ROOT" || true
            ls -la "$VCPKG_ROOT/scripts" || true
            exit 1
          fi
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> $GITHUB_ENV
          echo "VCPKG_FEATURE_FLAGS=manifests,registries" >> $GITHUB_ENV

      - name: Configure (CMake Preset)
        run: |
          cmake --preset ci-linux -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake" -DBUILD_EXTRAS=ON

      - name: Build
        run: |
          cmake --build build/ci-linux -j 3
          file build/ci-linux/apps/* || true

      - name: Run tests
        run: |
          ctest --test-dir build/ci-linux --output-on-failure -j 2

      - name: Run pre-commit
        run: |
          python3 -m pip install --upgrade pip
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: Validate shaders (glslangValidator)
        run: |
          set -e
          find shaders shaders_vk -type f \( -name "*.vert" -o -name "*.frag" -o -name "*.comp" -o -name "*.glsl" \) -print0 | xargs -0 -n1 -I{} glslangValidator -V {}

      - name: Enforce asset size budget
        run: |
          MAX_BYTES=$((80*1024*1024))
          BYTES=$(du -sb assets | awk '{print $1}')
          echo "Assets size: $BYTES bytes (budget: $MAX_BYTES)"
          if [ "$BYTES" -gt "$MAX_BYTES" ]; then
            echo "Asset size exceeds budget"; exit 1; fi

      - name: Clang-Tidy (as CMake step)
        run: |
          cmake --preset ci-linux -DCMAKE_CXX_CLANG_TIDY="clang-tidy;-warnings-as-errors=*" -S .
          cmake --build build/ci-linux -j 2 || true
        continue-on-error: true

      - name: Coverage configure and run
        run: |
          cmake --preset coverage -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"
          cmake --build build_coverage -j 2
          ctest --test-dir build_coverage --output-on-failure -j 2 || true
          pip install gcovr
          gcovr -r . --xml-pretty -o coverage.xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-linux
          path: coverage.xml

      - name: Operator console smoke test (2s)
        run: |
          if [ -x ./build/ci-linux/apps/operator_console ]; then \
            timeout 2s ./build/ci-linux/apps/operator_console --config configs/operator_console.yaml --headless || true; \
          else echo "operator_console not built"; fi

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: build/ci-linux
          if-no-files-found: warn