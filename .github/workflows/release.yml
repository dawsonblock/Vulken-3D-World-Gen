name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'f7423ee180c4b7f40d43402c2feb3859161ef625'
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libvulkan-dev vulkan-validationlayers-dev glslang-tools shaderc \
            libglfw3-dev libglm-dev libxinerama-dev libxcursor-dev libxi-dev libxrandr-dev
      
      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DVOXELVK_DEMO_WERROR=ON \
            -DENABLE_TESTS=ON
      
      - name: Build
        run: |
          cmake --build build --config RelWithDebInfo -j
      
      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure --parallel 4 --timeout 300
      
      - name: Compile shaders
        run: |
          python3 tools/shader_build.py \
            --source-dirs shaders shaders_vk \
            --output-dir build/resources/spv
      
      - name: Create release directory
        run: |
          mkdir -p release/linux-x64
      
      - name: Copy binaries
        run: |
          cp -r build/apps/* release/linux-x64/
          cp -r build/resources/spv release/linux-x64/
          cp -r config release/linux-x64/
          cp README.md LICENSE CHANGELOG.md release/linux-x64/
      
      - name: Create tarball
        run: |
          cd release
          tar -czf voxelvk-linux-x64.tar.gz linux-x64/
          sha256sum voxelvk-linux-x64.tar.gz > voxelvk-linux-x64.tar.gz.sha256
          pip install cyclonedx-bom
          cyclonedx-py --version || true
          python3 -m cyclonedx_py -o voxelvk-linux-x64.bom.json || true
      
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voxelvk-linux-x64
          path: |
            release/voxelvk-linux-x64.tar.gz
            release/voxelvk-linux-x64.tar.gz.sha256
            release/voxelvk-linux-x64.bom.json
          retention-days: 30

  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup vcpkg
        uses: microsoft/setup-vcpkg@v1
        with:
          vcpkg-version: '2024.12.12'
      
      - name: Install Vulkan SDK
        run: |
          choco install vulkan-sdk -y
      
      - name: Configure CMake
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DVOXELVK_DEMO_WERROR=ON \
            -DENABLE_TESTS=ON
      
      - name: Build
        run: |
          cmake --build build --config RelWithDebInfo --parallel
      
      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure --parallel 4 --timeout 300
      
      - name: Compile shaders
        run: |
          python tools/shader_build.py --source-dirs shaders shaders_vk --output-dir build/resources/spv
      
      - name: Create release directory
        run: |
          mkdir release\windows-x64
      
      - name: Copy binaries
        run: |
          xcopy /E /I build\apps\* release\windows-x64\
          xcopy /E /I build\resources\spv release\windows-x64\resources\spv\
          xcopy /E /I config release\windows-x64\config\
          copy README.md release\windows-x64\
          copy LICENSE release\windows-x64\
          copy CHANGELOG.md release\windows-x64
      
      - name: Create zip archive
        run: |
          cd release
          powershell Compress-Archive -Path windows-x64 -DestinationPath voxelvk-windows-x64.zip
          certutil -hashfile voxelvk-windows-x64.zip SHA256 > voxelvk-windows-x64.zip.sha256
          pip install cyclonedx-bom || python -m pip install cyclonedx-bom
          python -m cyclonedx_py -o voxelvk-windows-x64.bom.json || echo "SBOM generation failed"
      
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voxelvk-windows-x64
          path: |
            release/voxelvk-windows-x64.zip
            release/voxelvk-windows-x64.zip.sha256
            release/voxelvk-windows-x64.bom.json
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: voxelvk-linux-x64
          path: release/linux
      
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: voxelvk-windows-x64
          path: release/windows
      
      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      
      - name: Create release notes
        id: release_notes
        run: |
          cat > release_notes.md << EOF
          # VoxelVK ${{ steps.version.outputs.version }}
          
          ## Downloads (SHA256 + SBOM)
          
          ### Linux x64
          - **voxelvk-linux-x64.tar.gz** - Complete Linux x64 package
          - **SHA256**: \`$(cat release/linux/voxelvk-linux-x64.tar.gz.sha256 | cut -d' ' -f1)\`
          - **SBOM**: CycloneDX JSON
          
          ### Windows x64
          - **voxelvk-windows-x64.zip** - Complete Windows x64 package
          - **SHA256**: \`$(cat release/windows/voxelvk-windows-x64.zip.sha256 | cut -d' ' -f1)\`
          - **SBOM**: CycloneDX JSON
          
          ## Installation
          
          1. Download the appropriate package for your platform
          2. Extract the archive
          3. Run the demo applications
          
          ## Requirements
          
          - Vulkan 1.3 compatible GPU and drivers
          - Windows 10/11 (Windows) or Ubuntu 20.04+ (Linux)
          - 4GB+ RAM recommended
          
          ## What's New
          
          See [CHANGELOG.md](CHANGELOG.md) for detailed changes.
          EOF
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: VoxelVK ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          files: |
            release/linux/voxelvk-linux-x64.tar.gz
            release/linux/voxelvk-linux-x64.tar.gz.sha256
            release/linux/voxelvk-linux-x64.bom.json
            release/windows/voxelvk-windows-x64.zip
            release/windows/voxelvk-windows-x64.zip.sha256
            release/windows/voxelvk-windows-x64.bom.json
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'