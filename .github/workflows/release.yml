name: Release
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build (Release)
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools shaderc ninja-build
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          scripts/compile_shaders.sh

      - name: Archive artifacts
        run: |
          mkdir -p artifacts
          cp -r build/bin artifacts/ || true
          cp -r build/shaders artifacts/ || true
          tar -czf vulken_artifacts.tgz artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vulken_artifacts.tgz

  docker:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vulken-3d-world-gen:${{ github.ref_name }}
