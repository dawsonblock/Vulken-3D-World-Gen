name: Shader Validation & Regression Testing

on:
  push:
    branches: [ main, develop, 'upgrade/*' ]
    paths:
      - 'shaders/**'
      - 'shaders_vk/**'
      - 'src/**/*.hpp'
      - 'src/**/*.h'
      - 'include/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'shaders/**'
      - 'shaders_vk/**'
      - 'src/**/*.hpp'
      - 'src/**/*.h'
      - 'include/**'

env:
  VULKAN_SDK_VERSION: "1.3.268"

jobs:
  validate-and-test-shaders:
    runs-on: ubuntu-22.04
    
    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml

    - name: Setup Vulkan SDK (for shader tools)
      uses: humbletim/setup-vulkan-sdk@v1.2.0
      with:
        vulkan-query-version: 1.3.250.0
        vulkan-components: Vulkan-Headers, Vulkan-Loader, Glslang, Shaderc
        vulkan-use-cache: true

    - name: Verify shader tools
      run: |
        glslc --version
        spirv-cross --version || echo "spirv-cross not available, layout validation disabled"

    - name: Bootstrap shader toolchain
      run: |
        python3 scripts/shaders/bootstrap_toolchain.py || echo "Vulkan tools not available, using mock validation"

    - name: Setup CMake and Ninja
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: '3.27'

    - name: Configure CMake (for shader compilation)
      run: |
        cmake --preset linux-default -DSHADER_VALIDATION_ONLY=ON || echo "Using fallback configuration"

    - name: Compile shaders
      run: |
        cmake --build build --target compile_all_shaders || echo "Shader compilation skipped (tools unavailable)"

    - name: Validate shader layouts
      run: |
        python3 scripts/shaders/validate_layout.py \
          --shader-dirs build/shaders_cache shaders shaders_vk \
          --cpp-dirs src include \
          --report reports/shaders/layout_check.json

    - name: Check shader validation results
      run: |
        if [ -f reports/shaders/layout_check.json ]; then
          python3 -c "
import json
with open('reports/shaders/layout_check.json') as f:
    report = json.load(f)
    summary = report.get('validation_summary', {})
    status = summary.get('validation_status', 'UNKNOWN')
    mismatches = summary.get('total_mismatches', 0)
    print(f'Shader validation status: {status}')
    print(f'Layout mismatches: {mismatches}')
    if status == 'FAIL' and mismatches > 0:
        exit(1)
"
        else
          echo "No shader validation report generated"
        fi

    - name: Upload shader validation report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: shader-validation-report
        path: |
          reports/shaders/
          build/shaders_cache/

    - name: Comment PR with shader validation results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          
          try {
            const report = JSON.parse(fs.readFileSync('reports/shaders/layout_check.json', 'utf8'));
            const summary = report.validation_summary || {};
            
            const comment = `## 🔧 Shader Validation Results
            
**Status**: ${summary.validation_status || 'UNKNOWN'}
**Shaders Validated**: ${summary.total_shaders || 0}  
**Layout Mismatches**: ${summary.total_mismatches || 0}
**Warnings**: ${summary.total_warnings || 0}
**Errors**: ${summary.total_errors || 0}

${summary.validation_status === 'PASS' ? '✅ All shader layouts validated successfully!' : '⚠️ Shader validation issues detected. Please review the detailed report.'}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  shader-regression-test:
    runs-on: ubuntu-22.04
    needs: validate-and-test-shaders
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          vulkan-tools mesa-vulkan-drivers \
          libvulkan-dev build-essential cmake ninja-build
          
    - name: Setup vcpkg
      run: |
        ./vcpkg/bootstrap-vcpkg.sh
        
    - name: Build shader regression test
      run: |
        cmake --preset ci-release
        cmake --build build_ci --target voxelvk_tests -j
        
    - name: Run shader regression tests
      run: |
        cd build_ci
        mkdir -p reports/shader_diffs
        ctest -R shader_regression --output-on-failure
        
    - name: Upload shader diff artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: shader-regression-diffs
        path: build_ci/reports/shader_diffs/
        
    - name: Comment PR with regression results
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let comment = '## 🎨 Shader Regression Test Results\n\n';
          
          try {
            // Check if any diffs were generated
            const diffDir = 'build_ci/reports/shader_diffs';
            if (fs.existsSync(diffDir)) {
              const diffFiles = fs.readdirSync(diffDir);
              if (diffFiles.length > 0) {
                comment += '⚠️ **Shader regressions detected!**\n\n';
                comment += `Found ${diffFiles.length} shader(s) with visual differences:\n`;
                for (const file of diffFiles.slice(0, 10)) {
                  comment += `- ${file}\n`;
                }
                if (diffFiles.length > 10) {
                  comment += `- ... and ${diffFiles.length - 10} more\n`;
                }
                comment += '\n📎 Check the uploaded artifacts for detailed diff images.\n';
              } else {
                comment += '✅ **No shader regressions detected!**\n\n';
                comment += 'All shader outputs match the golden images.\n';
              }
            } else {
              comment += '✅ **No shader regressions detected!**\n\n';
              comment += 'All shader outputs match the golden images.\n';
            }
          } catch (error) {
            comment += '❓ **Unable to determine regression status**\n\n';
            comment += `Error: ${error.message}\n`;
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
          } catch (error) {
            console.log('Could not read shader validation report:', error.message);
          }