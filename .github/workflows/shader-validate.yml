name: Shader Validate
on:
  push:
    paths:
      - 'shaders_vk/**'
      - 'scripts/compile_shaders.sh'
      - 'tests/render/test_shader_compile.sh'
  pull_request:
    paths:
      - 'shaders_vk/**'
      - 'scripts/compile_shaders.sh'
      - 'tests/render/test_shader_compile.sh'

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install glslc
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools shaderc

      - name: Validate compilation
        run: |
          chmod +x scripts/compile_shaders.sh tests/render/test_shader_compile.sh
          scripts/compile_shaders.sh
          tests/render/test_shader_compile.sh
