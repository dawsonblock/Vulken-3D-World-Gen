name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  format_check:
    name: Formatting (clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: Check formatting
        run: |
          set -e
          FILES=$(git ls-files '*.cpp' '*.hpp' '*.h' '*.cc' '*.cxx' | tr '\n' ' ')
          if [ -n "$FILES" ]; then
            clang-format --version
            STYLE_OPT="-style=file"
            if [ ! -f .clang-format ]; then
              echo "No .clang-format found, using LLVM default style"
              STYLE_OPT="-style=LLVM"
            fi
            for f in $FILES; do clang-format $STYLE_OPT --dry-run --Werror "$f"; done
          else
            echo "No C/C++ files to check."
          fi

  build_and_test:
    name: Build and Test (RelWithDebInfo + Warnings as Errors)
    runs-on: ${{ matrix.os }}
    needs: [format_check]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg
            ${{ runner.temp }}/vcpkg_bin_cache
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-
      
      - name: Setup vcpkg  
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'f7423ee180c4b7f40d43402c2feb3859161ef625'
      
      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            ccache libvulkan-dev vulkan-validationlayers-dev glslang-tools shaderc \
            libglfw3-dev libglm-dev
      
      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install vulkan-sdk -y
      
      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DVOXELVK_DEMO_WERROR=ON \
            -DENABLE_TESTS=ON
            
      - name: Shader validation (glslangValidator)
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          find shaders shaders_vk -type f \( -name "*.vert" -o -name "*.frag" -o -name "*.comp" -o -name "*.glsl" \) -print0 | xargs -0 -n1 -I{} glslangValidator -V {}
            
      - name: Run pre-commit (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -m pip install --upgrade pip
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure
          
      - name: Run pre-commit (Windows)  
        if: matrix.os == 'windows-latest'
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure
      
      - name: Build
        run: |
          cmake --build build --config RelWithDebInfo -j
          if command -v clang-tidy >/dev/null 2>&1; then echo "clang-tidy available"; fi
      
      - name: Run unit tests
        run: |
          cd build
          ctest --output-on-failure --parallel 4 --timeout 300
          
      - name: Run operator console smoke test (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ -f build/apps/operator_console ]; then
            echo "Running operator console headless smoke test for 2 seconds..."
            timeout 2s ./build/apps/operator_console --headless || true
            echo "Operator console smoke test completed"
          else
            echo "operator_console not built (requires BUILD_EXTRAS=ON)"
          fi
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-RelWithDebInfo
          path: |
            build/apps/
            build/tests/
            build/Testing/
          retention-days: 7

      - name: Generate coverage (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y gcovr || true
          cmake -S . -B build_coverage -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS=--coverage -DCMAKE_EXE_LINKER_FLAGS=--coverage
          cmake --build build_coverage -j 2
          ctest --test-dir build_coverage --output-on-failure -j 2 || true
          gcovr -r . --xml-pretty -o coverage.xml || true
      - name: Upload coverage artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-linux
          path: coverage.xml

  coverage:
    name: Coverage Report (Linux)
    runs-on: ubuntu-latest
    needs: [format_check]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Setup vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg
            ${{ runner.temp }}/vcpkg_bin_cache
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-
      
      - name: Setup vcpkg  
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'f7423ee180c4b7f40d43402c2feb3859161ef625'
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libvulkan-dev vulkan-validationlayers-dev glslang-tools \
            gcovr
            
      - name: Configure with coverage
        run: |
          cmake --preset coverage \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake
            
      - name: Build
        run: |
          cmake --build build_coverage -j
          
      - name: Run tests with coverage
        run: |
          ctest --test-dir build_coverage --output-on-failure -j 2
          
      - name: Generate coverage report
        run: |
          gcovr -r . --xml-pretty -o coverage.xml \
            --exclude-unreachable-branches \
            --exclude-directories build_coverage
            
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  tidy:
    name: Clang-Tidy (Linux)
    runs-on: ubuntu-latest
    needs: [format_check]
    env:
      TIDY_FAIL_ON_WARNINGS: ${{ vars.TIDY_FAIL_ON_WARNINGS || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain & tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy build-essential cmake ninja-build \
            ccache libvulkan-dev vulkan-validationlayers-dev glslang-tools shaderc
      - name: Configure (export compile commands)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DVOXELVK_HEADLESS_ONLY=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Run clang-tidy
        run: |
          mkdir -p artifacts
          FILES=$(git ls-files '*.cpp' '*.cc' '*.cxx' | tr '\n' ' ')
          if [ -z "$FILES" ]; then
            echo "No C++ sources." | tee artifacts/clang-tidy-report.txt
            exit 0
          fi
          echo "Running clang-tidy..."
          clang-tidy -p build $FILES | tee artifacts/clang-tidy-report.txt || true
      - name: Fail on warnings (configurable)
        run: |
          if [ "${{ env.TIDY_FAIL_ON_WARNINGS }}" = "true" ]; then
            WARN=$(grep -E "\bwarning:\b" -c artifacts/clang-tidy-report.txt || true)
            echo "clang-tidy warnings: $WARN"
            if [ "$WARN" -gt 0 ]; then
              echo "Failing build due to clang-tidy warnings."
              exit 1
            fi
          else
            echo "TIDY_FAIL_ON_WARNINGS=false — not failing on warnings."
          fi

  shader_check:
    name: Shader Compile Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: { os: [ubuntu-latest, windows-latest] }
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan tools (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools shaderc
      - name: Install Vulkan SDK (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          choco install vulkan-sdk -y
      - name: Compile shaders
        shell: bash
        run: |
          bash ./scripts/compile_shaders.sh
      - name: Cache SPIR-V
        uses: actions/cache@v4
        with:
          path: .cache/spv
          key: ${{ runner.os }}-spv-${{ hashFiles('**/*.vert', '**/*.frag', '**/*.comp', '**/*.glsl') }}
      - name: Upload compiled shaders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shaders-${{ matrix.os }}
          path: .cache/spv/**

  build:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    needs: [format_check, tidy, shader_check]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        preset: [gui, headless]

    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg_bin_cache
      VCPKG_DEFAULT_TRIPLET: ${{ runner.os == 'Windows' && 'x64-windows' || 'x64-linux' }}
      VCPKG_ROOT: ${{ runner.temp }}/vcpkg
      CCACHE_DIR: ${{ runner.temp }}/.ccache
      PIPE_CACHE_DIR: ${{ github.workspace }}/.cache/vk_pipeline_cache
      VK_PIPELINE_CACHE_PATH: ${{ github.workspace }}/.cache/vk_pipeline_cache/voxelvk_pipelines.cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pipeline cache (Vulkan)
        uses: actions/cache@v4
        with:
          path: ${{ env.PIPE_CACHE_DIR }}
          key: ${{ runner.os }}-vkpipe-${{ github.ref }}

      - name: ccache cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', 'vcpkg.json') }}

      - name: Install deps (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git python3 \
            ccache libvulkan-dev vulkan-validationlayers-dev vulkan-tools \
            glslang-tools shaderc python3-matplotlib
          ccache -s || true

      - name: Install Vulkan SDK (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          choco install vulkan-sdk -y
          choco install ccache -y || echo "ccache not available on Windows runner"
          echo "VULKAN_SDK=$Env:VULKAN_SDK" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'f7423ee180c4b7f40d43402c2feb3859161ef625'

      - name: Bootstrap local vcpkg (toolchain under repo)
        shell: bash
        run: |
          set -e
          VCPKG_DIR="${GITHUB_WORKSPACE}/vcpkg"
          if [ -d "$VCPKG_DIR" ] && [ ! -f "$VCPKG_DIR/bootstrap-vcpkg.sh" ]; then
            echo "Found incomplete vcpkg dir at $VCPKG_DIR (missing bootstrap). Replacing..."
            rm -rf "$VCPKG_DIR"
          fi
          if [ ! -d "$VCPKG_DIR" ]; then
            git clone --depth 1 https://github.com/microsoft/vcpkg "$VCPKG_DIR"
          fi
          if [ ! -x "$VCPKG_DIR/vcpkg" ]; then
            "$VCPKG_DIR/bootstrap-vcpkg.sh" -disableMetrics
          fi
          if [ ! -f "$VCPKG_DIR/scripts/buildsystems/vcpkg.cmake" ]; then
            echo "vcpkg toolchain file missing: $VCPKG_DIR/scripts/buildsystems/vcpkg.cmake"
            ls -la "$VCPKG_DIR" || true
            ls -la "$VCPKG_DIR/scripts" || true
            exit 1
          fi
          echo "VCPKG_ROOT=$VCPKG_DIR" >> $GITHUB_ENV
          echo "VCPKG_FEATURE_FLAGS=manifests,registries" >> $GITHUB_ENV

      - name: vcpkg install
        run: |
          "${{ env.VCPKG_ROOT }}/vcpkg" install
        shell: bash

      - name: Download shader artifact
        uses: actions/download-artifact@v4
        with:
          name: shaders-${{ matrix.os }}
          path: build/shaders_prebuilt

      - name: Configure (CMake)
        run: |
          PRESET="default"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            PRESET="windows-default"
          fi
          if [ "${{ matrix.preset }}" = "headless" ]; then
            if [ "${{ matrix.os }}" = "windows-latest" ]; then
              # No dedicated windows headless preset; override the option
              cmake --preset windows-default -DVOXELVK_HEADLESS_ONLY=ON \
                -DCMAKE_BUILD_TYPE=Release -DVOXELVK_ENABLE_CUDA=OFF -DVOXELVK_ENABLE_TENSORRT=OFF \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DVK_PIPELINE_CACHE_PATH="${{ env.VK_PIPELINE_CACHE_PATH }}" \
                -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake";
            else
              cmake --preset headless -DCMAKE_BUILD_TYPE=Release \
                -DVOXELVK_ENABLE_CUDA=OFF -DVOXELVK_ENABLE_TENSORRT=OFF \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DVK_PIPELINE_CACHE_PATH="${{ env.VK_PIPELINE_CACHE_PATH }}" \
                -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake";
            fi
          else
            cmake --preset "$PRESET" -DCMAKE_BUILD_TYPE=Release \
              -DVOXELVK_ENABLE_CUDA=OFF -DVOXELVK_ENABLE_TENSORRT=OFF \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DVK_PIPELINE_CACHE_PATH="${{ env.VK_PIPELINE_CACHE_PATH }}" \
              -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake";
          fi
        shell: bash

      - name: Build
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cmake --build build-windows --config Release --parallel;
          else
            if [ "${{ matrix.preset }}" = "headless" ]; then
              cmake --build build_headless --config Release --parallel;
            else
              cmake --build build --config Release --parallel;
            fi
          fi
        shell: bash

      - name: Run smoke test (Linux headless)
        if: matrix.os == 'ubuntu-latest' && matrix.preset == 'headless'
        env:
          VK_PIPELINE_CACHE_PATH: ${{ env.VK_PIPELINE_CACHE_PATH }}
        run: |
          mkdir -p "$(dirname "$VK_PIPELINE_CACHE_PATH")"
          if [ -x "./scripts/run_headless.sh" ]; then
            timeout 20s ./scripts/run_headless.sh || true
          elif [ -x "./build_headless/apps/smoke_headless" ]; then
            timeout 10s ./build_headless/apps/smoke_headless || true
          else
            echo "No headless runner found."
          fi
        shell: bash

      - name: Run smoke test (Windows headless)
        if: matrix.os == 'windows-latest' && matrix.preset == 'headless'
        shell: powershell
        run: |
          $exe = "build-windows\apps\smoke_headless.exe"
          if (Test-Path $exe) {
            Write-Host "Starting smoke_headless for 10s..."
            $p = Start-Process -FilePath $exe -PassThru
            Start-Sleep -Seconds 10
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          } elseif (Test-Path ".\scripts\run_headless.ps1") {
            Write-Host "Running scripts\run_headless.ps1"
            $p = Start-Process -FilePath "powershell" -ArgumentList "-File .\scripts\run_headless.ps1" -PassThru
            Start-Sleep -Seconds 10
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          } else {
            Write-Host "No Windows headless runner found."
          }

      - name: Upload vcpkg installed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-installed-${{ matrix.os }}
          path: |
            ${{ env.VCPKG_ROOT }}/installed/**

      - name: Archive build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.preset }}-build
          path: |
            build/**
            !**/*.obj
            !**/*.o

  perf_cpu:
    name: Perf CPU (Linux)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Install perf
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-common linux-tools-generic || true
          which perf || true
          sudo sysctl -w kernel.perf_event_paranoid=1 || true
          sudo sysctl -w kernel.kptr_restrict=0 || true
      - name: Configure & build headless
        run: |
          cmake -S . -B build -G Ninja -DVOXELVK_HEADLESS_ONLY=ON
          cmake --build build --config Release -j
      - name: Record CPU profile (10s)
        run: |
          bash ./scripts/perf_headless.sh 10 || true
      - name: Upload CPU perf artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-cpu
          path: |
            perf.data
            perf_report.txt

  unit_tests:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    needs: [format_check, tidy]
    strategy:
      matrix: { os: [ubuntu-latest, windows-latest] }
    env:
      VCPKG_DEFAULT_TRIPLET: ${{ runner.os == 'Windows' && 'x64-windows' || 'x64-linux' }}
      VCPKG_ROOT: ${{ runner.temp }}/vcpkg
    steps:
      - uses: actions/checkout@v4
      - name: Install deps (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build
      - name: Install deps (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          echo "Windows tests using vcpkg toolchain"
      - name: Setup vcpkg
        uses: microsoft/vcpkg-action@v1
        with:
          vcpkgGitCommitId: 1b5a7a7e1aee5b287f2e7a9e0f9a8f9510b5c3f8
          appendedCacheKey: ${{ matrix.os }}
      - name: Bootstrap local vcpkg (toolchain under repo)
        shell: bash
        run: |
          set -e
          VCPKG_DIR="${GITHUB_WORKSPACE}/vcpkg"
          if [ -d "$VCPKG_DIR" ] && [ ! -f "$VCPKG_DIR/bootstrap-vcpkg.sh" ]; then
            echo "Found incomplete vcpkg dir at $VCPKG_DIR (missing bootstrap). Replacing..."
            rm -rf "$VCPKG_DIR"
          fi
          if [ ! -d "$VCPKG_DIR" ]; then
            git clone --depth 1 https://github.com/microsoft/vcpkg "$VCPKG_DIR"
          fi
          if [ ! -x "$VCPKG_DIR/vcpkg" ]; then
            "$VCPKG_DIR/bootstrap-vcpkg.sh" -disableMetrics
          fi
          if [ ! -f "$VCPKG_DIR/scripts/buildsystems/vcpkg.cmake" ]; then
            echo "vcpkg toolchain file missing: $VCPKG_DIR/scripts/buildsystems/vcpkg.cmake"
            ls -la "$VCPKG_DIR" || true
            ls -la "$VCPKG_DIR/scripts" || true
            exit 1
          fi
          echo "VCPKG_ROOT=$VCPKG_DIR" >> $GITHUB_ENV
          echo "VCPKG_FEATURE_FLAGS=manifests,registries" >> $GITHUB_ENV
      - name: vcpkg install
        run: |
          "${{ env.VCPKG_ROOT }}/vcpkg" install
        shell: bash
      - name: Configure (tests only)
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cmake --preset windows-default -DVOXELVK_HEADLESS_ONLY=ON -DENABLE_TESTS=ON -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake";
          else
            cmake --preset headless -DENABLE_TESTS=ON -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake";
          fi
      - name: Build tests
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cmake --build build-windows --config Release --parallel;
          else
            cmake --build build_headless --config Release --parallel;
          fi
      - name: Run tests
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ctest --test-dir build-windows -C Release --output-on-failure;
          else
            ctest --test-dir build_headless -C Release --output-on-failure;
          fi

  perf_bench:
    name: Perf Bench (Linux headless)
    runs-on: ubuntu-latest
    needs: [build]
    env:
      PERF_REGRESSION_TOLERANCE: ${{ vars.PERF_REGRESSION_TOLERANCE || '0.20' }}
      STRICT_BASELINE: ${{ vars.STRICT_BASELINE || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-matplotlib
      - name: Configure & build headless
        run: |
          cmake -S . -B build -G Ninja -DVOXELVK_HEADLESS_ONLY=ON
          cmake --build build --config Release -j
      - name: Run bench (30s)
        run: |
          bash ./scripts/bench_headless.sh 30 | tee bench.log
      - name: Parse & plot
        run: |
          python3 .github/scripts/bench_parse.py bench.log
      - name: Compare to baseline
        run: |
          python3 .github/scripts/bench_compare.py
      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-bench
          path: |
            bench.log
            bench_stats.json
            perf_compare_report.md
            perf_frametime_hist.png
            perf_fps_hist.png

  pr_comment:
    name: PR Perf Comment
    if: github.event_name == 'pull_request'
    needs: [perf_bench]
    runs-on: ubuntu-latest
    steps:
      - name: Download perf artifacts
        uses: actions/download-artifact@v4
        with:
          name: perf-bench
          path: perf
      - name: Read report
        id: read
        run: |
          echo "text<<EOF" >> $GITHUB_OUTPUT
          cat perf/perf_compare_report.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Post sticky comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            **Perf Report**
            ${{ steps.read.outputs.text }}
            
            Artifacts: perf_bench (histograms + stats).

  image_golden:
    name: Image Golden Diff
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: { os: [ubuntu-latest, windows-latest] }
    env:
      GOLDEN_STRICT: ${{ vars.GOLDEN_STRICT || '0' }}
      PSNR_MIN: ${{ vars.GOLDEN_PSNR_MIN || '30' }}
      MAE_MAX: ${{ vars.GOLDEN_MAE_MAX || '2' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build
      - name: Run golden diff (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          bash ./scripts/golden_diff.sh
      - name: Run golden diff (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          .\scripts\golden_diff.ps1
      - name: Upload image diff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-${{ matrix.os }}
          path: |
            imagediff.png
            imagediff_report.json

  publish_pages:
    name: Publish Perf Report (GitHub Pages)
    if: github.ref == 'refs/heads/main'
    needs: [perf_bench]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download perf artifacts
        uses: actions/download-artifact@v4
        with:
          name: perf-bench
          path: pages
      - name: Generate badge.json
        run: |
          python3 - <<'PY'
          import json
          j=None
          try:
            j=json.load(open('pages/bench_stats.json'))
          except Exception:
            j={}
          m=j.get('mean_frametime_ms') if isinstance(j,dict) else None
          color='lightgrey'; msg='n/a'
          if isinstance(m,(int,float)):
            msg=f"{m:.1f} ms"
            if m<12: color='brightgreen'
            elif m<16: color='green'
            elif m<22: color='yellow'
            else: color='red'
          badge={'schemaVersion':1,'label':'frametime','message':msg,'color':color}
          open('pages/badge.json','w').write(json.dumps(badge))
          print('badge',badge)
          PY
      - name: Generate index.html
        run: |
          cat > pages/index.html <<'HTML'
          <!doctype html>
          <html>
          <head><meta charset="utf-8"><title>VoxelVK Perf Report</title>
          <style>body{font-family:sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem} table{border-collapse:collapse} td,th{border:1px solid #ddd;padding:6px 10px}</style>
          </head>
          <body>
            <h1>VoxelVK Perf Report</h1>
            <p>Branch: ${GITHUB_REF}</p>
            <h2>Regression Summary</h2>
            <pre id="report"></pre>
            <h2>Key Metrics</h2>
            <table id="stats"><tr><th>Metric</th><th>Value</th></tr></table>
            <h2>Frametime</h2>
            <img src="perf_frametime_hist.png" alt="frametime" style="max-width: 900px;">
            <h2>FPS</h2>
            <img src="perf_fps_hist.png" alt="fps" style="max-width: 900px;">
            <script>
            fetch('perf_compare_report.md').then(r=>r.text()).then(t=>document.getElementById('report').textContent=t);
            fetch('bench_stats.json').then(r=>r.json()).then(j=>{
              const tbl=document.getElementById('stats');
              const entries=[["mean_fps",j.mean_fps],["median_fps",j.median_fps],["mean_frametime_ms",j.mean_frametime_ms],["median_frametime_ms",j.median_frametime_ms],["p95_frametime_ms",j.p95_frametime_ms],["count_fps",j.count_fps],["count_ms",j.count_ms]];
              for(const [k,v] of entries){ const tr=document.createElement('tr'); const td1=document.createElement('td'); td1.textContent=k; const td2=document.createElement('td'); td2.textContent=(v===null||v===undefined)?'—':(typeof v==='number'?v.toFixed(2):v); tr.append(td1,td2); tbl.append(tr); }
            }).catch(()=>{});
            </script>
          </body></html>
          HTML

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  shader_validation:
    name: Shader Validation & Layout Check
    runs-on: ubuntu-latest
    needs: [build_and_test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.0
        with:
          vulkan-query-version: 1.3.250.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader, Glslang, Shaderc
          vulkan-use-cache: true
      
      - name: Install spirv-cross
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-cross
      
      - name: Verify shader tools
        run: |
          glslc --version
          spirv-cross --version
          glslangValidator --version
      
      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '3.27'
      
      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      
      - name: Compile shaders
        run: |
          cmake --build build --target compile_all_shaders
      
      - name: Validate shaders with glslangValidator
        run: |
          echo "Validating shader compilation..."
          SHADER_FAIL=0
          find shaders shaders_vk -type f \( -name "*.vert" -o -name "*.frag" -o -name "*.comp" -o -name "*.glsl" \) | while read shader; do
            echo "Validating $shader"
            if ! glslangValidator -V "$shader" -o /tmp/test.spv; then
              echo "ERROR: Shader validation failed for $shader"
              SHADER_FAIL=1
            fi
          done
          if [ $SHADER_FAIL -eq 1 ]; then
            echo "FAIL: Shader validation errors detected"
            exit 1
          fi
          echo "PASS: All shaders compiled successfully"
      
      - name: Check asset size budget
        run: |
          echo "Checking asset size budget..."
          ASSET_SIZE=$(du -sb assets/ 2>/dev/null | cut -f1 || echo "0")
          BUDGET_MB=100
          BUDGET_BYTES=$((BUDGET_MB * 1024 * 1024))
          echo "Asset size: $ASSET_SIZE bytes (Budget: $BUDGET_BYTES bytes)"
          if [ $ASSET_SIZE -gt $BUDGET_BYTES ]; then
            echo "ERROR: Assets exceed size budget of ${BUDGET_MB}MB"
            exit 1
          fi
          echo "PASS: Assets within budget"
      
      - name: Validate shader layouts
        run: |
          python3 scripts/shaders/validate_layout.py \
            --shader-dirs build/shaders_cache shaders shaders_vk \
            --cpp-dirs src include \
            --report reports/shaders/layout_check.json
      
      - name: Check shader validation results
        run: |
          if [ -f reports/shaders/layout_check.json ]; then
            python3 -c "
import json
with open('reports/shaders/layout_check.json') as f:
    report = json.load(f)
    summary = report.get('validation_summary', {})
    status = summary.get('validation_status', 'UNKNOWN')
    mismatches = summary.get('total_mismatches', 0)
    print(f'Shader validation status: {status}')
    print(f'Layout mismatches: {mismatches}')
    if status == 'FAIL' and mismatches > 0:
        print('FAIL: Shader layout validation failed')
        exit(1)
    print('PASS: Shader layout validation successful')
"
          else
            echo "ERROR: No shader validation report generated"
            exit 1
          fi
      
      - name: Upload shader validation report
        uses: actions/upload-artifact@v4
        with:
          name: shader-validation-report
          path: |
            reports/shaders/
            build/shaders_cache/

  gui_smoke:
    name: GUI Smoke Test
    runs-on: ubuntu-latest
    needs: [build_and_test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install GUI dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            mesa-vulkan-drivers libvulkan1 vulkan-tools glslang-tools \
            libglfw3-dev libglm-dev \
            libxinerama-dev libxcursor-dev libxi-dev libxrandr-dev \
            xvfb x11vnc websockify fluxbox novnc imagemagick
      
      - name: Setup vcpkg  
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'f7423ee180c4b7f40d43402c2feb3859161ef625'
      
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build --config RelWithDebInfo -j
      
      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure -j2
      
      - name: GUI smoke test
        env:
          GUI_ARGS: --smoke --benchmark --frames 120 --autoscreenshot --export-perf --perf-out .
          PORT: 6080
        run: |
          set -e
          # Start virtual desktop + app (auto-exits after ~2s)
          scripts/start_gui_web.sh || true
          # Give some time to render at least a couple frames
          sleep 3
          # Take a screenshot from the virtual display
          DISPLAY=:99 import -window root screenshot.png || true
          # Always stop services
          scripts/stop_gui_web.sh || true
      
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshot
          path: screenshot.png
      
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-performance
          path: performance_report.json

  nsys_trace:
    name: Nsight Systems Trace (self-hosted GPU)
    if: ${{ vars.ENABLE_NSIGHT == 'true' }}
    runs-on: ${{ vars.NSYS_RUNNER || 'self-hosted' }}
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Verify nsys
        run: |
          which nsys || (echo "nsys not found; install Nsight Systems CLI on the runner" && exit 1)
          nsys --version || true
      - name: Configure & build headless
        run: |
          cmake -S . -B build -G Ninja -DVOXELVK_HEADLESS_ONLY=ON
          cmake --build build --config Release -j
      - name: Run nsys trace (10s)
        run: |
          bash ./scripts/nsys_headless.sh 10
      - name: Upload nsys artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nsys-trace
          path: |
            nsys_report.qdrep
            nsys_report.sqlite

  release_artifacts:
    name: Release Artifacts & Integrity
    runs-on: ${{ matrix.os }}
    needs: [build_and_test]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Setup vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg
            ${{ runner.temp }}/vcpkg_bin_cache
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-
      
      - name: Setup vcpkg  
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'f7423ee180c4b7f40d43402c2feb3859161ef625'
          
      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libvulkan-dev vulkan-validationlayers-dev
            
      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install vulkan-sdk -y
          
      - name: Configure with hardening
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            cmake --preset ci-linux \
              -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake
          else
            cmake --preset ci-windows \
              -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake
          fi
        shell: bash
        
      - name: Build
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            cmake --build build/ci-linux --config RelWithDebInfo -j
          else
            cmake --build build/ci-windows --config RelWithDebInfo -j
          fi
        shell: bash
        
      - name: Generate SBOM
        run: |
          python3 scripts/dev/generate_sbom.py --output sbom-${{ matrix.os }}.json
        shell: bash
        
      - name: Generate SHA256SUMS
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            cd build/ci-linux/apps
            find . -type f -executable -exec sha256sum {} \; > ../../../SHA256SUMS-linux.txt
          else
            cd build/ci-windows/apps
            certutil -hashfile *.exe SHA256 > ../../../SHA256SUMS-windows.txt
          fi
        shell: bash
        
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            sbom-${{ matrix.os }}.json
            SHA256SUMS-${{ matrix.os }}.txt
            build/*/apps/
