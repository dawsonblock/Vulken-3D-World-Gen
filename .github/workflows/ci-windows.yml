name: CI Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC (Developer Command Prompt)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Bootstrap vcpkg (manifest mode)
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE 'vcpkg'
          if (Test-Path $vcpkgRoot) {
            if (-not (Test-Path (Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat'))) {
              Write-Host "Found incomplete vcpkg dir at $vcpkgRoot (missing bootstrap). Recreating..."
              Remove-Item -Recurse -Force $vcpkgRoot
            }
          }
          if (-not (Test-Path $vcpkgRoot)) {
            git clone --depth 1 https://github.com/microsoft/vcpkg $vcpkgRoot
          }
          Write-Host "vcpkg root: $vcpkgRoot"
          Get-ChildItem -Force $vcpkgRoot | Select-Object -ExpandProperty Name
          $bootstrapBat = Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat'
          if (-not (Test-Path (Join-Path $vcpkgRoot 'vcpkg.exe'))) {
            if (-not (Test-Path $bootstrapBat)) {
              Write-Error "bootstrap script not found at $bootstrapBat"
              exit 1
            }
            cmd.exe /c "`"$bootstrapBat`" -disableMetrics"
          }
          # Verify toolchain file exists
          $toolchain = Join-Path $vcpkgRoot 'scripts/buildsystems/vcpkg.cmake'
          if (-not (Test-Path $toolchain)) {
            Write-Error "vcpkg toolchain file missing: $toolchain"
            Get-ChildItem -Recurse -Depth 2 $vcpkgRoot | Select-Object -First 100 | ForEach-Object { $_.FullName }
            exit 1
          }
          echo "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          echo "VCPKG_FEATURE_FLAGS=manifests,registries" >> $env:GITHUB_ENV

      - name: Cache vcpkg and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}\build-windows\vcpkg_installed
            ${{ github.workspace }}\vcpkg\downloads
            ${{ github.workspace }}\vcpkg\buildtrees
          key: vcpkg-win-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json','CMakePresets.json') }}

      - name: Configure (CMake Preset)
        shell: bash
        run: |
          cmake --preset ci-windows -DBUILD_EXTRAS=ON -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\\vcpkg\\scripts\\buildsystems\\vcpkg.cmake"

      - name: Build
        shell: bash
        run: |
          cmake --build build/ci-windows -j 3
          echo "msvc hardening flags should be present via CMake (/guard:cf /DYNAMICBASE /NXCOMPAT /CETCOMPAT)"

      - name: Run tests
        shell: bash
        run: |
          ctest --test-dir build/ci-windows --output-on-failure -j 2

      - name: Run pre-commit
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: Validate shaders (glslangValidator)
        shell: bash
        run: |
          git-bash -lc "for f in $(git ls-files 'shaders/**/*.vert' 'shaders/**/*.frag' 'shaders/**/*.comp' 'shaders_vk/**/*.vert' 'shaders_vk/**/*.frag' 'shaders_vk/**/*.comp'); do glslangValidator -V \"$f\" || exit 1; done"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: build/ci-windows
          if-no-files-found: warn

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: build/ci-windows