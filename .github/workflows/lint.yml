name: Lint
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff cmakelint

      - name: Python (ruff)
        run: |
          ruff check .

      - name: cmakelint
        run: |
          cmakelint CMakeLists.txt cmake/*.cmake || true

      - name: clang tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy clang-format
          # format check (non-fatal)
          git ls-files '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' | xargs -r clang-format --Werror --dry-run || true
