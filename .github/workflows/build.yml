name: Build (Linux & Windows)
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools shaderc vulkan-tools ninja-build
          echo "GLSLC=$(command -v glslc)" >> $GITHUB_ENV

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install vulkan-sdk --version=1.3.290.0 -y
          echo "GLSLC=$Env:VULKAN_SDK\Bin\glslc.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "PATH=$Env:VULKAN_SDK\Bin;$Env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Compile shaders
        shell: bash
        run: |
          chmod +x scripts/compile_shaders.sh
          GLSLC="${{ env.GLSLC }}" scripts/compile_shaders.sh

      - name: Headless smoke
        if: runner.os == 'Linux' # typically easier to run headless
        run: |
          chmod +x tests/smoke/engine_headless.sh
          tests/smoke/engine_headless.sh
