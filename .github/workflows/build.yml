name: Build and Test

on:
  push:
    branches: [ main, develop, 'upgrade/*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022]
        build_type: [RelWithDebInfo, Debug]
        include:
          - os: ubuntu-22.04
            cmake_preset: linux-default
            vcpkg_triplet: x64-linux
          - os: windows-2022
            cmake_preset: windows-default
            vcpkg_triplet: x64-windows

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml redis

    - name: Setup vcpkg
      uses: microsoft/setup-vcpkg@v1
      with:
        vcpkg-version: '2024.01.12'

    - name: Cache vcpkg packages
      uses: actions/cache@v3
      with:
        path: |
          ${{ env.VCPKG_ROOT }}/installed
          ${{ env.VCPKG_ROOT }}/packages
        key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ matrix.os }}-

    - name: Setup CMake and Ninja
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: '3.27'

    - name: Configure CMake
      run: |
        cmake --preset ${{ matrix.cmake_preset }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      run: |
        cmake --build build --config ${{ matrix.build_type }} -j

    - name: Create test directories
      run: |
        mkdir -p tests/golden
        mkdir -p reports/bench

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure --parallel 4 --timeout 300

    - name: Generate reports
      if: always()
      run: |
        python scripts/data/load_assets_to_redis.py --seed --assets-dir assets || true
        python scripts/shaders/validate_layout.py --shader-dirs build/shaders_cache --cpp-dirs src include --report reports/shaders/layout_check.json || true

    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.build_type }}
        path: |
          reports/
          tests/golden/
          build/Testing/

    - name: Upload build artifacts (Ubuntu Release only)
      if: matrix.os == 'ubuntu-22.04' && matrix.build_type == 'RelWithDebInfo'
      uses: actions/upload-artifact@v4
      with:
        name: vulken3d-linux-x64
        path: |
          build/apps/
          config/
          assets/