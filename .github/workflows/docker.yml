name: Docker Build and Security

on:
  push:
    branches: [ main, develop, 'release/*' ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3.6.1

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3.3.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5.5.1
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build Docker image
      uses: docker/build-push-action@v6.7.0
      with:
        context: .
        push: false
        load: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILD_TYPE=RelWithDebInfo

    - name: Test Docker image
      run: |
        # Get the first tag for testing
        IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
        echo "Testing image: $IMAGE_TAG"
        
        # Test basic container functionality
        docker run --rm $IMAGE_TAG --help || echo "Help command test"
        
        # Test headless mode
        docker run --rm $IMAGE_TAG --headless --validate || echo "Headless validation test"

    - name: Install security scanning tools
      run: |
        # Install Syft for SBOM generation
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
        
        # Install Grype for vulnerability scanning  
        curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

    - name: Generate SBOM
      run: |
        IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
        syft $IMAGE_TAG -o spdx-json=sbom.spdx.json
        syft $IMAGE_TAG -o table=sbom.txt

    - name: Vulnerability scan
      run: |
        IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
        grype $IMAGE_TAG -o table --fail-on medium > vulnerability-report.txt || echo "Vulnerabilities found"
        grype $IMAGE_TAG -o sarif --fail-on medium > vulnerability-report.sarif || echo "SARIF report generated"

    - name: Upload SARIF to GitHub Security
      if: always()
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: vulnerability-report.sarif
        category: container-scan

    - name: Check vulnerability scan results
      run: |
        echo "Vulnerability scan summary:"
        cat vulnerability-report.txt || echo "No vulnerability report found"
        
        # Check for critical/high vulnerabilities
        if grep -q "Critical\|High" vulnerability-report.txt; then
          echo "⚠️ Critical or High severity vulnerabilities found!"
          echo "VULN_FOUND=true" >> $GITHUB_ENV
        else
          echo "✅ No critical or high severity vulnerabilities found"
          echo "VULN_FOUND=false" >> $GITHUB_ENV
        fi

    - name: Push Docker image
      if: github.event_name != 'pull_request' && env.VULN_FOUND != 'true'
      uses: docker/build-push-action@v6.7.0
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILD_TYPE=RelWithDebInfo

    - name: Upload security artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          sbom.*
          vulnerability-report.*

    - name: Comment PR with security results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          
          try {
            const vulnReport = fs.readFileSync('vulnerability-report.txt', 'utf8');
            const lines = vulnReport.split('\n');
            
            // Extract summary information
            const criticalCount = (vulnReport.match(/Critical/g) || []).length;
            const highCount = (vulnReport.match(/High/g) || []).length;
            const mediumCount = (vulnReport.match(/Medium/g) || []).length;
            const lowCount = (vulnReport.match(/Low/g) || []).length;
            
            let comment = `## 🐳 Docker Security Scan Results\n\n`;
            comment += `| Severity | Count |\n`;
            comment += `|----------|-------|\n`;
            comment += `| Critical | ${criticalCount} |\n`;
            comment += `| High | ${highCount} |\n`;
            comment += `| Medium | ${mediumCount} |\n`;
            comment += `| Low | ${lowCount} |\n\n`;
            
            if (criticalCount > 0 || highCount > 0) {
              comment += `⚠️ **Security issues detected!** Please review the detailed scan results.\n`;
            } else {
              comment += `✅ **No critical or high severity vulnerabilities found.**\n`;
            }
            
            comment += `\n📋 **SBOM and detailed vulnerability report available in workflow artifacts.**\n`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } catch (error) {
            console.log('Could not read vulnerability report:', error.message);
          }