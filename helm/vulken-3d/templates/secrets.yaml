{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vulken-3d.fullname" . }}-postgres
  labels:
    {{- include "vulken-3d.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ .Values.postgres.auth.postgresPassword | b64enc }}
{{- end }}

{{- if .Values.extraSecrets }}
{{- range $name, $data := .Values.extraSecrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vulken-3d.fullname" $ }}-{{ $name }}
  labels:
    {{- include "vulken-3d.labels" $ | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | b64enc }}
  {{- end }}
{{- end }}
{{- end }}