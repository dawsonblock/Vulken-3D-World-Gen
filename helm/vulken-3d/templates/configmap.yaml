apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vulken-3d.fullname" . }}-config
  labels:
    {{- include "vulken-3d.labels" . | nindent 4 }}
data:
  engine.yaml: |
    engine:
      name: "Vulken-3D-World-Gen"
      version: "{{ .Chart.AppVersion }}"
      log_level: "{{ .Values.config.logLevel }}"
      headless_fallback: {{ .Values.config.headlessMode }}
    vulkan:
      validation_layers: false  # Disabled in production
      device_selection: "auto"
      memory_budget_mb: {{ .Values.resources.limits.memory | default "2048Mi" | regexReplaceAll "Mi" "" }}
      pipeline_cache: true
    world:
      chunk_size: 64
      render_distance: {{ .Values.config.renderDistance }}
      generation_threads: 4
      async_loading: true
    performance:
      target_fps: {{ .Values.config.targetFPS }}
      vsync: true
      dynamic_resolution: false
      cpu_budget_ms: 16.6

  renderer.yaml: |
    renderer:
      backend: "vulkan"
      resolution:
        width: 1920
        height: 1080
      msaa_samples: {{ .Values.config.msaaSamples | default 4 }}
      depth_format: "D32_SFLOAT"
    shaders:
      validation: false  # Disabled in production
      hot_reload: false
      cache_spirv: true
      optimization: "performance"
    post_processing:
      taa:
        enabled: true
        feedback: 0.95
      ssao:
        enabled: {{ .Values.config.enableSSAO | default true }}
        radius: 0.5
        samples: 16
      ssr:
        enabled: {{ .Values.config.enableSSR | default false }}
        max_steps: 64
      bloom:
        enabled: true
        threshold: 1.0
    shadows:
      csm:
        enabled: true
        cascade_count: 4
        resolution: 2048
        lambda: 0.5
      pcss:
        enabled: true
        sample_radius: 0.01
    lighting:
      ibl:
        enabled: true
      clustered_forward:
        enabled: true
        tile_size: 16

  datasets.yaml: |
    storage:
      mode: {{ if .Values.redis.enabled }}"redis"{{ else }}"filesystem"{{ end }}
      cache_size_mb: 512
      async_io: true
    filesystem:
      assets_root: "assets/"
      cache_dir: ".cache/"
    {{- if .Values.redis.enabled }}
    redis:
      host: {{ include "vulken-3d.fullname" . }}-redis
      port: 6379
      db: 0
      key_prefix: "vulken3d:"
      compression: "lz4"
    {{- end }}
    assets:
      textures:
        formats: ["jpg", "png", "exr"]
        max_size_mb: 256
      meshes:
        formats: ["obj", "gltf", "mvox"]
        max_vertices: 100000
      palettes:
        formats: ["json", "yaml"]
        biome_types: ["desert", "forest", "arctic", "volcanic"]

  weather.yaml: |
    weather:
      enable_dynamic_weather: {{ .Values.config.enableWeather | default true }}
      update_interval_seconds: 30
      transition_speed: 0.1
    biomes:
      default_biome: "temperate"
      biome_blend_distance: 64
    simulation:
      wind:
        enable_wind_simulation: true
        base_wind_speed: 5.0
        wind_variation: 2.0
      precipitation:
        enable_precipitation: true
        max_precipitation_rate: 50.0
        precipitation_fade_time: 10.0
      temperature:
        base_temperature: 20.0
        seasonal_variation: 15.0
        daily_variation: 10.0