apiVersion: v1
kind: Service
metadata:
  name: {{ include "vulken-3d.fullname" . }}
  labels:
    {{- include "vulken-3d.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.healthPort }}
      targetPort: health
      protocol: TCP
      name: health
  selector:
    {{- include "vulken-3d.selectorLabels" . | nindent 4 }}

{{- if .Values.redis.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vulken-3d.fullname" . }}-redis
  labels:
    {{- include "vulken-3d.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    {{- include "vulken-3d.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
{{- end }}

{{- if .Values.postgres.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vulken-3d.fullname" . }}-postgres
  labels:
    {{- include "vulken-3d.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    {{- include "vulken-3d.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
{{- end }}