replicaCount: 1
image:
  repository: ghcr.io/vulken/vulken-3d
  pullPolicy: IfNotPresent
  tag: latest
service:
  type: ClusterIP
  port: 8080
  healthPort: 8081
resources:
  limits:
    nvidia.com/gpu: 1
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 2Gi
nodeSelector:
  feature.node.kubernetes.io/pci-10de.present: 'true'
tolerations:
- key: nvidia.com/gpu
  operator: Exists
  effect: NoSchedule
redis:
  enabled: true
  auth:
    enabled: false
postgres:
  enabled: false
  auth:
    postgresPassword: vulken3d
    database: world_persistence
config:
  logLevel: INFO
  headlessMode: true
  renderDistance: 8
  targetFPS: 60
