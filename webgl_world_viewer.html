<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VoxelVK • 3D World Viewer (WebGL)</title>
  <link rel="stylesheet" href="assets/css/viewer.css" />
</head>
<body>
  <div class="toolbar">
    <h1>VoxelVK • 3D World Viewer</h1>
    <div class="row">
      <label>Height Scale</label>
      <input id="heightScale" type="range" min="0.2" max="5" step="0.1" value="1.5" />
      <span id="heightScaleVal" class="hint">1.5×</span>
    </div>
    <div class="row">
      <label><input id="toggleFog" type="checkbox" checked /> Fog</label>
      <label><input id="toggleGrid" type="checkbox" checked /> Grid</label>
      <label><input id="toggleWater" type="checkbox" checked /> Water</label>
      <label><input id="mergedWater" type="checkbox" /> Merged Water</label>
      <label><input id="toggleStreaming" type="checkbox" /> Streaming</label>
    </div>
    <div class="row">
      <label>Visualization
        <select id="vizMode">
          <option value="default" selected>Default</option>
          <option value="slope">Slope</option>
          <option value="biomes">Biomes</option>
        </select>
      </label>
      <button id="resetCamera" title="Frame terrain">Reset Camera</button>
      <button id="savePNG" title="Save screenshot as PNG">Save PNG</button>
      <span class="hint">FPS: <span id="fps">--</span></span>
      <label>Draw Dist <input id="drawDist" type="range" min="50" max="2048" step="50" value="800" /></label>
      <span class="hint"><span id="drawDistVal">800</span>m</span>
      <label><input id="wireframe" type="checkbox" /> Wireframe</label>
    </div>
    <div class="spacer"></div>
    <div class="row hint">Drag = Orbit • Shift+Drag = Pan • Wheel/Pinch = Zoom</div>
  </div>
  <div id="app"></div>
  <div id="hud" class="hud">Click terrain to inspect</div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.159/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.159/examples/jsm/controls/OrbitControls.js';

    const app = document.getElementById('app');
    const heightScaleEl = document.getElementById('heightScale');
    const heightScaleVal = document.getElementById('heightScaleVal');
    const toggleFogEl = document.getElementById('toggleFog');
    const toggleGridEl = document.getElementById('toggleGrid');
    const toggleWaterEl = document.getElementById('toggleWater');
    const mergedWaterEl = document.getElementById('mergedWater');
    const toggleStreamingEl = document.getElementById('toggleStreaming');
    const resetCameraEl = document.getElementById('resetCamera');
    const vizModeEl = document.getElementById('vizMode');
    const savePNGEl = document.getElementById('savePNG');
    const drawDistEl = document.getElementById('drawDist');
    const drawDistValEl = document.getElementById('drawDistVal');
    const wireframeEl = document.getElementById('wireframe');
    const fpsEl = document.getElementById('fps');

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    app.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#0b0d12');
    const defaultFog = new THREE.Fog(scene.background, 120, 800);
    scene.fog = defaultFog;

    // Procedural equirect environment for IBL
    const pmrem = new THREE.PMREMGenerator(renderer);
    function makeEnvEquirect() {
      const w = 512, h = 256;
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      const grd = ctx.createLinearGradient(0, 0, 0, h);
      grd.addColorStop(0, '#224466');
      grd.addColorStop(0.5, '#223344');
      grd.addColorStop(1, '#102015');
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, w, h);
      const tex = new THREE.CanvasTexture(c);
      tex.mapping = THREE.EquirectangularReflectionMapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    {
      const envTex = makeEnvEquirect();
      const envRT = pmrem.fromEquirectangular(envTex);
      scene.environment = envRT.texture;
      envTex.dispose();
    }

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
    camera.position.set(120, 140, 120);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0, 0);
    controls.screenSpacePanning = true;

    // Procedural textures for terrain (grass/stone)
    const TEX_SCALE = 8.0; // bigger = more repeats per unit
    function makeProceduralTexture(kind) {
      const size = 256;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(size, size);
      const data = img.data;
      const seed = Math.random() * 1000;
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const i = (y * size + x) * 4;
          const nx = x / size, ny = y / size;
          // layered value noise using trig for speed
          let v = 0.0;
          v += 0.55 * (0.5 + 0.5 * Math.sin(12.3 * nx + 7.1 * ny + seed));
          v += 0.30 * (0.5 + 0.5 * Math.sin(25.7 * nx + 17.9 * ny + seed * 1.7));
          v += 0.15 * (0.5 + 0.5 * Math.sin(52.1 * nx + 41.3 * ny + seed * 2.3));
          v = Math.min(1, Math.max(0, v));
          let r, g, b;
          if (kind === 'grass') {
            r = 60 + 30 * v; g = 150 + 70 * v; b = 80 + 40 * v;
          } else { // stone
            const base = 130 + 50 * (v - 0.5);
            r = g = b = base;
          }
          data[i+0] = Math.max(0, Math.min(255, Math.round(r)));
          data[i+1] = Math.max(0, Math.min(255, Math.round(g)));
          data[i+2] = Math.max(0, Math.min(255, Math.round(b)));
          data[i+3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      return tex;
    }
    const GRASS_TEX = makeProceduralTexture('grass');
    const STONE_TEX = makeProceduralTexture('stone');

    // Optional PBR texture pack (albedo/normal/roughness) loader with fallback
    const texLoader = new THREE.TextureLoader();
    function loadTex(url, colorSpace) {
      return new Promise((resolve) => {
        texLoader.load(url, (t) => {
          if (colorSpace) t.colorSpace = colorSpace;
          t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4;
          resolve(t);
        }, undefined, () => resolve(null));
      });
    }
    async function tryLoadPBRTextures() {
      const base = 'assets/textures';
      const grassAlbedo = await loadTex(`${base}/grass_albedo.jpg`, THREE.SRGBColorSpace);
      const grassNormal = await loadTex(`${base}/grass_normal.jpg`, THREE.NoColorSpace);
      const grassRough = await loadTex(`${base}/grass_roughness.jpg`, THREE.NoColorSpace);
      const stoneAlbedo = await loadTex(`${base}/stone_albedo.jpg`, THREE.SRGBColorSpace);
      const stoneNormal = await loadTex(`${base}/stone_normal.jpg`, THREE.NoColorSpace);
      const stoneRough = await loadTex(`${base}/stone_roughness.jpg`, THREE.NoColorSpace);
      if (grassAlbedo && stoneAlbedo) {
        return {
          grass: { map: grassAlbedo, normal: grassNormal, roughness: grassRough },
          stone: { map: stoneAlbedo, normal: stoneNormal, roughness: stoneRough },
        };
      }
      return null;
    }

    // Procedural normal map for water ripples
    const WATER_UV_SCALE = 8.0;
    function makeWaterNormalTexture() {
      const size = 256;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(size, size);
      const data = img.data;
      const seed = Math.random() * 1000;
      // Generate a tileable height field using combined sines
      function height(x, y) {
        const nx = (x / size) * Math.PI * 2.0;
        const ny = (y / size) * Math.PI * 2.0;
        let h = 0.0;
        h += 0.6 * Math.sin(2.5 * nx + 1.3 * ny + seed);
        h += 0.4 * Math.cos(3.7 * nx - 2.1 * ny + seed * 1.3);
        h += 0.2 * Math.sin(5.1 * nx + 4.2 * ny + seed * 2.1);
        return h;
      }
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          // Finite differences for normal
          const hL = height((x - 1 + size) % size, y);
          const hR = height((x + 1) % size, y);
          const hD = height(x, (y - 1 + size) % size);
          const hU = height(x, (y + 1) % size);
          const dx = (hR - hL) * 0.5;
          const dy = (hU - hD) * 0.5;
          let nx = -dx, ny = -dy, nz = 1.0;
          const invLen = 1.0 / Math.hypot(nx, ny, nz);
          nx *= invLen; ny *= invLen; nz *= invLen;
          const i = (y * size + x) * 4;
          data[i+0] = Math.round((nx * 0.5 + 0.5) * 255);
          data[i+1] = Math.round((ny * 0.5 + 0.5) * 255);
          data[i+2] = Math.round((nz * 0.5 + 0.5) * 255);
          data[i+3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.NoColorSpace;
      tex.anisotropy = 4;
      tex.matrixAutoUpdate = true;
      tex.repeat.set(1.5, 1.5);
      return tex;
    }
    const WATER_NORM_TEX = makeWaterNormalTexture();

    // Lights
    const hemi = new THREE.HemisphereLight(0xddeeff, 0x223344, 0.6);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff, 0.9);
    dir.position.set(200, 400, 200);
    dir.castShadow = false;
    scene.add(dir);

    // Ground grid (optional)
    const grid = new THREE.GridHelper(1000, 100, 0x224466, 0x223344);
    grid.material.opacity = 0.25; grid.material.transparent = true;
    scene.add(grid);

    // Color palette aligned with 2D viewer
    const COLORS = [
      new THREE.Color('#111111'), // Air
      new THREE.Color('#888888'), // Stone
      new THREE.Color('#3ddc84'), // Grass
      new THREE.Color('#3ec0ff'), // Water
      new THREE.Color('#e88020'), // Tree
    ];

    // Terrain building with chunking and water overlay
    const TILE = 64; // chunk size
    let terrainChunks = [];
    let waterMesh = null;
    let waterUniforms = null;
    let worldData = null;
    let lastMinH = 0, lastHRange = 1;
    let terrainMaterial = null;
    let TEX_PACK = null; // set on load() if assets are found
    // Streaming & LOD
    let streamingEnabled = false; // default off to keep current behavior
    let chunkMap = new Map(); // key -> { mesh, x0, z0, step }
    const STREAM_NEAR = 200, STREAM_MID = 500, STREAM_FAR = 900;
    let currentHeightScale = parseFloat((document.getElementById('heightScale')?.value) || '1.5');
    let lastStreamCenter = new THREE.Vector3(Infinity, 0, Infinity);

    function stepForDist(d) {
      if (d < STREAM_NEAR) return 1;
      if (d < STREAM_MID) return 2;
      return 4;
    }

    function buildTerrain(data, heightScale) {
      const W = data.width;
      const D = data.depth;
      const heights = data.heights;
      const types = data.types;

      // Compute min/max height
      let minH = Infinity, maxH = -Infinity;
      for (let i = 0; i < heights.length; i++) {
        const h = heights[i] || 0;
        if (h < minH) minH = h;
        if (h > maxH) maxH = h;
      }
      const hRange = Math.max(1, maxH - minH);

      // Helper to compute world-space Y from height sample
      const hToY = (h) => ((h - minH) / hRange) * 50 * heightScale;

      // Build chunk meshes
      const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0.0, side: THREE.DoubleSide });
      // Attach base maps (either PBR pack or procedural) and blend albedos in shader
      if (TEX_PACK && TEX_PACK.grass) {
        mat.map = TEX_PACK.grass.map;
        if (TEX_PACK.grass.normal) mat.normalMap = TEX_PACK.grass.normal;
        if (TEX_PACK.grass.roughness) mat.roughnessMap = TEX_PACK.grass.roughness;
      } else {
        mat.map = GRASS_TEX;
      }
      mat.onBeforeCompile = (shader) => {
        const grassMap = (TEX_PACK && TEX_PACK.grass) ? TEX_PACK.grass.map : GRASS_TEX;
        const stoneMap = (TEX_PACK && TEX_PACK.stone) ? TEX_PACK.stone.map : STONE_TEX;
        shader.uniforms.uGrassMap = { value: grassMap };
        shader.uniforms.uStoneMap = { value: stoneMap };
        shader.uniforms.uTexScale = { value: TEX_SCALE };
        shader.fragmentShader = shader.fragmentShader.replace(
          '#include <map_pars_fragment>',
          `#include <map_pars_fragment>\nuniform sampler2D uGrassMap;\nuniform sampler2D uStoneMap;\nuniform float uTexScale;`
        );
        shader.fragmentShader = shader.fragmentShader.replace(
          '#include <map_fragment>',
          `#ifdef USE_MAP\n  vec2 uvScaled = vUv * uTexScale;\n  vec4 texG = texture2D(uGrassMap, uvScaled);\n  vec4 texS = texture2D(uStoneMap, uvScaled);\n  float slope = clamp(1.0 - normalize(normal).y, 0.0, 1.0);\n  float w = smoothstep(0.25, 0.9, slope);\n  vec4 texelColor = mix(texG, texS, w);\n  diffuseColor *= texelColor;\n#endif`
        );
      };
      terrainMaterial = mat;
      const halfX = (W - 1) / 2;
      const halfZ = (D - 1) / 2;
      const chunks = [];

      for (let z0 = 0; z0 < D; z0 += TILE) {
        for (let x0 = 0; x0 < W; x0 += TILE) {
          const cw = Math.min(TILE, W - x0);
          const cd = Math.min(TILE, D - z0);

          const positions = new Float32Array(cw * cd * 3);
          const uvs = new Float32Array(cw * cd * 2);
          const indices = new Uint32Array((cw - 1) * (cd - 1) * 6);
          const hbuf = new Float32Array(cw * cd);
          const tbuf = new Uint8Array(cw * cd);

          let p = 0; let uvp = 0;
          for (let lz = 0; lz < cd; lz++) {
            for (let lx = 0; lx < cw; lx++) {
              const gx = x0 + lx;
              const gz = z0 + lz;
              const idx = gz * W + gx;
              const h = heights[idx] || 0;
              const t = types[idx] || 0;
              const y = hToY(h);

              const wx = gx - halfX;
              const wz = gz - halfZ;
              positions[p++] = wx;
              positions[p++] = y;
              positions[p++] = wz;
              // planar UV from world XZ
              uvs[uvp++] = wx / TEX_SCALE;
              uvs[uvp++] = wz / TEX_SCALE;

              const vi = lz * cw + lx;
              hbuf[vi] = h;
              tbuf[vi] = t;
            }
          }

          let k = 0;
          for (let lz = 0; lz < cd - 1; lz++) {
            for (let lx = 0; lx < cw - 1; lx++) {
              const a = lz * cw + lx;
              const b = lz * cw + (lx + 1);
              const c1 = (lz + 1) * cw + lx;
              const d = (lz + 1) * cw + (lx + 1);
              indices[k++] = a; indices[k++] = c1; indices[k++] = b;
              indices[k++] = b; indices[k++] = c1; indices[k++] = d;
            }
          }

          const geom = new THREE.BufferGeometry();
          geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
          geom.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
          geom.setIndex(new THREE.BufferAttribute(indices, 1));
          geom.computeVertexNormals();
          // Compute colors after normals for slope-based blending and subtle noise
          const normals = geom.getAttribute('normal');
          const colors = new Float32Array(cw * cd * 3);
          const smoothstep = (a,b,x) => {
            const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
            return t * t * (3 - 2 * t);
          };
          let cptr = 0;
          for (let vi = 0; vi < cw * cd; vi++) {
            const ny = Math.max(0, Math.min(1, normals.getY(vi)));
            const slope = 1.0 - ny; // 0 flat, 1 steep
            const t = tbuf[vi] | 0;
            const h = hbuf[vi];
            // base colors
            let col = COLORS[t] || COLORS[0];
            // Blend grass->stone on steep slopes
            if (t === 2 /* GRASS */ || t === 1 /* STONE */) {
              const g = COLORS[2];
              const s = COLORS[1];
              const w = smoothstep(0.25, 0.9, slope);
              col = new THREE.Color(
                g.r * (1 - w) + s.r * w,
                g.g * (1 - w) + s.g * w,
                g.b * (1 - w) + s.b * w
              );
            }
            // Subtle color noise by world position proxy via height value
            const n = 0.06 * Math.sin(h * 0.35) + 0.04 * Math.cos(h * 0.21);
            colors[cptr++] = Math.min(1, Math.max(0, col.r + n));
            colors[cptr++] = Math.min(1, Math.max(0, col.g + n));
            colors[cptr++] = Math.min(1, Math.max(0, col.b + n));
          }
          geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
          geom.computeBoundingSphere();

          const mesh = new THREE.Mesh(geom, mat);
          mesh.receiveShadow = true;
          mesh.castShadow = false;
          // Store buffers for recoloring later
          mesh.userData.cw = cw; mesh.userData.cd = cd;
          mesh.userData.hbuf = hbuf; mesh.userData.tbuf = tbuf;
          chunks.push(mesh);
        }
      }

      // Build water overlay
      const waterPositions = [];
      for (let gz = 0; gz < D; gz++) {
        for (let gx = 0; gx < W; gx++) {
          const i = gz * W + gx;
          if (types[i] === 3) { // Water
            const y = hToY(heights[i]) + 0.02; // slight offset to avoid z-fight
            waterPositions.push(gx - halfX, y, gz - halfZ);
          }
        }
      }
      let waterIMesh = null;
      if (waterPositions.length > 0) {
        if (mergedWaterEl && mergedWaterEl.checked) {
          // Build merged water surface: one quad per water cell
          const plane = new THREE.PlaneGeometry(1, 1);
          // Merge into a single mesh by manually constructing geometry
          const waterGeom = new THREE.BufferGeometry();
          const countCells = waterPositions.length / 3;
          const positionsArr = new Float32Array(countCells * 6 * 3); // 2 tris per cell
          const uvsArr = new Float32Array(countCells * 6 * 2);
          const alphas = new Float32Array(countCells * 6);
          let pi = 0, uvi = 0, ai = 0;
          for (let i = 0; i < countCells; i++) {
            const x = waterPositions[i*3+0];
            const y = waterPositions[i*3+1];
            const z = waterPositions[i*3+2];
            // Two triangles forming a 1x1 quad on XZ at height y
            const verts = [
              x-0.5, y, z-0.5,
              x+0.5, y, z-0.5,
              x-0.5, y, z+0.5,
              x+0.5, y, z-0.5,
              x+0.5, y, z+0.5,
              x-0.5, y, z+0.5,
            ];
            positionsArr.set(verts, pi);
            // Planar UVs from world XZ
            const uvVerts = [
              (x-0.5)/WATER_UV_SCALE, (z-0.5)/WATER_UV_SCALE,
              (x+0.5)/WATER_UV_SCALE, (z-0.5)/WATER_UV_SCALE,
              (x-0.5)/WATER_UV_SCALE, (z+0.5)/WATER_UV_SCALE,
              (x+0.5)/WATER_UV_SCALE, (z-0.5)/WATER_UV_SCALE,
              (x+0.5)/WATER_UV_SCALE, (z+0.5)/WATER_UV_SCALE,
              (x-0.5)/WATER_UV_SCALE, (z+0.5)/WATER_UV_SCALE,
            ];
            uvsArr.set(uvVerts, uvi);
            // Shoreline fade factor per tile (adjacent to land -> lower alpha)
            const gx = Math.max(0, Math.min(W - 1, Math.round(x + halfX)));
            const gz = Math.max(0, Math.min(D - 1, Math.round(z + halfZ)));
            const idx = gz * W + gx;
            let tileAlpha = 1.0;
            const neigh = [
              gx > 0 ? types[idx - 1] : 3,
              gx < W-1 ? types[idx + 1] : 3,
              gz > 0 ? types[idx - W] : 3,
              gz < D-1 ? types[idx + W] : 3,
            ];
            if (neigh.some(t => t !== 3)) tileAlpha = 0.65;
            for (let k = 0; k < 6; k++) alphas[ai + k] = tileAlpha;
            ai += 6; uvi += 12; pi += 18;
          }
          waterGeom.setAttribute('position', new THREE.BufferAttribute(positionsArr, 3));
          waterGeom.setAttribute('uv', new THREE.BufferAttribute(uvsArr, 2));
          waterGeom.setAttribute('alpha', new THREE.BufferAttribute(alphas, 1));
          waterGeom.computeVertexNormals();
          const wmat = new THREE.MeshPhysicalMaterial({
            color: COLORS[3], transparent: true, opacity: 0.45,
            roughness: 0.2, metalness: 0.0, reflectivity: 0.5, side: THREE.DoubleSide,
          });
          wmat.onBeforeCompile = (shader) => {
            shader.uniforms.uTime = { value: 0 };
            waterUniforms = shader.uniforms;
            // Pass per-vertex alpha to fragment
            shader.vertexShader = shader.vertexShader.replace(
              '#include <common>',
              '#include <common>\nattribute float alpha;\nvarying float vAlpha;'
            );
            shader.vertexShader = shader.vertexShader.replace(
              '#include <begin_vertex>',
              `#include <begin_vertex>\nvAlpha = alpha;\ntransformed.y += 0.05 * sin(2.5 * position.x + uTime*1.2) * cos(2.0 * position.z + uTime*0.8);`
            );
            shader.fragmentShader = shader.fragmentShader.replace(
              '#include <common>',
              '#include <common>\nvarying float vAlpha;'
            );
            shader.fragmentShader = shader.fragmentShader.replace(
              '#include <output_fragment>',
              `#include <output_fragment>\n// Fresnel + shoreline alpha\nvec3 V = normalize(-vViewPosition);\nfloat fres = pow(1.0 - clamp(dot(normalize(normal), V), 0.0, 1.0), 3.0);\ngl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(1.0), 0.15 * fres);\ngl_FragColor.a = gl_FragColor.a * vAlpha * (0.55 + 0.45 * fres);`
            );
          };
          // Apply normal map ripples
          wmat.normalMap = WATER_NORM_TEX;
          wmat.normalScale = new THREE.Vector2(0.7, 0.7);
          waterIMesh = new THREE.Mesh(waterGeom, wmat);
        } else {
          // Instanced water quads
          const count = waterPositions.length / 3;
          const plane = new THREE.PlaneGeometry(1, 1);
          const wmat = new THREE.MeshPhysicalMaterial({
            color: COLORS[3], transparent: true, opacity: 0.45,
            roughness: 0.2, metalness: 0.0, reflectivity: 0.5, side: THREE.DoubleSide,
          });
          // Inject ripple
          wmat.onBeforeCompile = (shader) => {
            shader.uniforms.uTime = { value: 0 };
            waterUniforms = shader.uniforms;
            shader.vertexShader = shader.vertexShader.replace(
              '#include <begin_vertex>',
              `#include <begin_vertex>\ntransformed.y += 0.05 * sin(2.5 * position.x + uTime*1.2) * cos(2.0 * position.z + uTime*0.8);`
            );
            shader.fragmentShader = shader.fragmentShader.replace(
              '#include <output_fragment>',
              `#include <output_fragment>\n// Fresnel post-process\nvec3 V = normalize(-vViewPosition);\nfloat fres = pow(1.0 - clamp(dot(normalize(normal), V), 0.0, 1.0), 3.0);\ngl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(1.0), 0.15 * fres);\ngl_FragColor.a = gl_FragColor.a * (0.55 + 0.45 * fres);`
            );
          };
          // Apply normal map ripples
          wmat.normalMap = WATER_NORM_TEX;
          wmat.normalScale = new THREE.Vector2(0.7, 0.7);
          waterIMesh = new THREE.InstancedMesh(plane, wmat, count);
          const m4 = new THREE.Matrix4();
          const q = new THREE.Quaternion();
          q.setFromAxisAngle(new THREE.Vector3(1,0,0), -Math.PI/2);
          for (let i = 0; i < count; i++) {
            const x = waterPositions[i*3+0];
            const y = waterPositions[i*3+1];
            const z = waterPositions[i*3+2];
            m4.compose(new THREE.Vector3(x, y, z), q, new THREE.Vector3(1,1,1));
            waterIMesh.setMatrixAt(i, m4);
          }
        }
      }

      return { chunks, water: waterIMesh, minH, maxH, hRange };
    }

    function clearTerrain() {
      for (const m of terrainChunks) { scene.remove(m); m.geometry.dispose(); }
      terrainChunks = [];
      if (waterMesh) { scene.remove(waterMesh); waterMesh.geometry.dispose(); waterMesh = null; }
    }

    function buildWaterOverlay(scale) {
      if (!worldData) return null;
      const W = worldData.width, D = worldData.depth;
      const heights = worldData.heights, types = worldData.types;
      const hToY = (h) => ((h - lastMinH) / Math.max(1, lastHRange)) * 50 * scale;
      const halfX = (W - 1) / 2, halfZ = (D - 1) / 2;
      const waterPositions = [];
      for (let gz = 0; gz < D; gz++) {
        for (let gx = 0; gx < W; gx++) {
          const i = gz * W + gx;
          if (types[i] === 3) {
            const y = hToY(heights[i]) + 0.02;
            waterPositions.push(gx - halfX, y, gz - halfZ);
          }
        }
      }
      if (waterPositions.length === 0) return null;
      let waterObj = null;
      if (mergedWaterEl && mergedWaterEl.checked) {
        const countCells = waterPositions.length / 3;
        const positionsArr = new Float32Array(countCells * 6 * 3);
        let pi = 0;
        for (let i = 0; i < countCells; i++) {
          const x = waterPositions[i*3+0];
          const y = waterPositions[i*3+1];
          const z = waterPositions[i*3+2];
          const verts = [
            x-0.5, y, z-0.5,
            x+0.5, y, z-0.5,
            x-0.5, y, z+0.5,
            x+0.5, y, z-0.5,
            x+0.5, y, z+0.5,
            x-0.5, y, z+0.5,
          ];
          positionsArr.set(verts, pi); pi += 18;
        }
        const waterGeom = new THREE.BufferGeometry();
        waterGeom.setAttribute('position', new THREE.BufferAttribute(positionsArr, 3));
        waterGeom.computeVertexNormals();
        const wmat = new THREE.MeshPhysicalMaterial({
          color: COLORS[3], transparent: true, opacity: 0.45,
          roughness: 0.2, metalness: 0.0, reflectivity: 0.5, side: THREE.DoubleSide,
        });
        wmat.onBeforeCompile = (shader) => {
          shader.uniforms.uTime = { value: 0 };
          waterUniforms = shader.uniforms;
          shader.vertexShader = shader.vertexShader.replace(
            '#include <begin_vertex>',
            `#include <begin_vertex>\ntransformed.y += 0.05 * sin(2.5 * position.x + uTime*1.2) * cos(2.0 * position.z + uTime*0.8);`
          );
          shader.fragmentShader = shader.fragmentShader.replace(
            '#include <output_fragment>',
            `#include <output_fragment>\nvec3 V = normalize(-vViewPosition);\nfloat fres = pow(1.0 - clamp(dot(normalize(normal), V), 0.0, 1.0), 3.0);\ngl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(1.0), 0.15 * fres);\ngl_FragColor.a = gl_FragColor.a * (0.55 + 0.45 * fres);`
          );
        };
        wmat.normalMap = WATER_NORM_TEX;
        wmat.normalScale = new THREE.Vector2(0.7, 0.7);
        waterObj = new THREE.Mesh(waterGeom, wmat);
      } else {
        const count = waterPositions.length / 3;
        const plane = new THREE.PlaneGeometry(1, 1);
        const wmat = new THREE.MeshPhysicalMaterial({
          color: COLORS[3], transparent: true, opacity: 0.45,
          roughness: 0.2, metalness: 0.0, reflectivity: 0.5, side: THREE.DoubleSide,
        });
        wmat.onBeforeCompile = (shader) => {
          shader.uniforms.uTime = { value: 0 };
          waterUniforms = shader.uniforms;
          shader.vertexShader = shader.vertexShader.replace(
            '#include <begin_vertex>',
            `#include <begin_vertex>\ntransformed.y += 0.05 * sin(2.5 * position.x + uTime*1.2) * cos(2.0 * position.z + uTime*0.8);`
          );
          shader.fragmentShader = shader.fragmentShader.replace(
            '#include <output_fragment>',
            `#include <output_fragment>\nvec3 V = normalize(-vViewPosition);\nfloat fres = pow(1.0 - clamp(dot(normalize(normal), V), 0.0, 1.0), 3.0);\ngl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(1.0), 0.15 * fres);\ngl_FragColor.a = gl_FragColor.a * (0.55 + 0.45 * fres);`
          );
        };
        wmat.normalMap = WATER_NORM_TEX;
        wmat.normalScale = new THREE.Vector2(0.7, 0.7);
        const imesh = new THREE.InstancedMesh(plane, wmat, count);
        const m4 = new THREE.Matrix4();
        const q = new THREE.Quaternion();
        q.setFromAxisAngle(new THREE.Vector3(1,0,0), -Math.PI/2);
        for (let i = 0; i < count; i++) {
          const x = waterPositions[i*3+0];
          const y = waterPositions[i*3+1];
          const z = waterPositions[i*3+2];
          m4.compose(new THREE.Vector3(x, y, z), q, new THREE.Vector3(1,1,1));
          imesh.setMatrixAt(i, m4);
        }
        waterObj = imesh;
      }
      return waterObj;
    }

    function buildChunkMeshLOD(x0, z0, step, scale) {
      const W = worldData.width, D = worldData.depth;
      const heights = worldData.heights, types = worldData.types;
      const halfX = (W - 1) / 2, halfZ = (D - 1) / 2;
      const hToY = (h) => ((h - lastMinH) / Math.max(1, lastHRange)) * 50 * scale;
      const cw = Math.min(TILE, W - x0);
      const cd = Math.min(TILE, D - z0);
      const gxList = [];
      const gzList = [];
      for (let gz = z0; gz < z0 + cd; gz += step) gzList.push(gz);
      for (let gx = x0; gx < x0 + cw; gx += step) gxList.push(gx);
      const NX = gxList.length, NZ = gzList.length;
      const positions = new Float32Array(NX * NZ * 3);
      const uvs = new Float32Array(NX * NZ * 2);
      const indices = new Uint32Array((NX - 1) * (NZ - 1) * 6);
      const hbuf = new Float32Array(NX * NZ);
      const tbuf = new Uint8Array(NX * NZ);
      let p = 0, uvp = 0;
      for (let iz = 0; iz < NZ; iz++) {
        for (let ix = 0; ix < NX; ix++) {
          const gx = gxList[ix];
          const gz = gzList[iz];
          const idx = gz * W + gx;
          const h = heights[idx] || 0;
          const t = types[idx] || 0;
          const y = hToY(h);
          const wx = gx - halfX;
          const wz = gz - halfZ;
          positions[p++] = wx; positions[p++] = y; positions[p++] = wz;
          uvs[uvp++] = wx / TEX_SCALE; uvs[uvp++] = wz / TEX_SCALE;
          const vi = iz * NX + ix; hbuf[vi] = h; tbuf[vi] = t;
        }
      }
      let k = 0;
      for (let iz = 0; iz < NZ - 1; iz++) {
        for (let ix = 0; ix < NX - 1; ix++) {
          const a = iz * NX + ix;
          const b = iz * NX + (ix + 1);
          const c1 = (iz + 1) * NX + ix;
          const d = (iz + 1) * NX + (ix + 1);
          indices[k++] = a; indices[k++] = c1; indices[k++] = b;
          indices[k++] = b; indices[k++] = c1; indices[k++] = d;
        }
      }
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geom.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
      geom.setIndex(new THREE.BufferAttribute(indices, 1));
      geom.computeVertexNormals();
      // Colors
      const normals = geom.getAttribute('normal');
      const colors = new Float32Array(NX * NZ * 3);
      const smoothstep = (a,b,x) => { const t = Math.min(1, Math.max(0, (x-a)/(b-a))); return t*t*(3-2*t); };
      let cptr = 0;
      for (let vi = 0; vi < NX * NZ; vi++) {
        const ny = Math.max(0, Math.min(1, normals.getY(vi)));
        const slope = 1.0 - ny;
        const t = tbuf[vi] | 0;
        const h = hbuf[vi];
        let col = COLORS[t] || COLORS[0];
        if (t === 2 || t === 1) {
          const g = COLORS[2], s = COLORS[1];
          const w = smoothstep(0.25, 0.9, slope);
          col = new THREE.Color(g.r*(1-w)+s.r*w, g.g*(1-w)+s.g*w, g.b*(1-w)+s.b*w);
        }
        const n = 0.06 * Math.sin(h * 0.35) + 0.04 * Math.cos(h * 0.21);
        colors[cptr++] = Math.min(1, Math.max(0, col.r + n));
        colors[cptr++] = Math.min(1, Math.max(0, col.g + n));
        colors[cptr++] = Math.min(1, Math.max(0, col.b + n));
      }
      geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geom.computeBoundingSphere();
      const mesh = new THREE.Mesh(geom, terrainMaterial);
      mesh.receiveShadow = true;
      mesh.castShadow = false;
      mesh.userData = { NX, NZ, hbuf, tbuf, x0, z0, step };
      return mesh;
    }

    function chunkKey(x0, z0, step) { return `${x0}_${z0}_s${step}`; }

    function resetStreaming(scale) {
      // Recompute height stats
      const heights = worldData.heights;
      let minH = Infinity, maxH = -Infinity;
      for (let i = 0; i < heights.length; i++) { const h = heights[i]; if (h < minH) minH = h; if (h > maxH) maxH = h; }
      lastMinH = minH; lastHRange = Math.max(1, maxH - minH);
      // Clear and rebuild water
      clearTerrain();
      waterMesh = buildWaterOverlay(scale);
      if (waterMesh) { scene.add(waterMesh); applyToggles(); }
      // Initialize streaming state
      chunkMap.clear();
      lastStreamCenter.set(Infinity, 0, Infinity);
      updateStreaming(true);
    }

    function updateStreaming(force = false) {
      if (!streamingEnabled || !worldData) return;
      const center = controls.target;
      const moved = center.distanceTo(lastStreamCenter);
      if (!force && moved < (TILE * 0.25)) return;
      lastStreamCenter.copy(center);

      const W = worldData.width, D = worldData.depth;
      const halfX = (W - 1) / 2, halfZ = (D - 1) / 2;
      const needed = new Set();
      for (let z0 = 0; z0 < D; z0 += TILE) {
        for (let x0 = 0; x0 < W; x0 += TILE) {
          const cx = (x0 + Math.min(TILE, W - x0) * 0.5) - halfX;
          const cz = (z0 + Math.min(TILE, D - z0) * 0.5) - halfZ;
          const dist = Math.hypot(cx - center.x, cz - center.z);
          if (dist > STREAM_FAR * 1.5) continue; // outside far radius
          const step = stepForDist(dist);
          const key = chunkKey(x0, z0, step);
          needed.add(key);
          // If a different LOD chunk exists for same region, remove it
          for (const k of chunkMap.keys()) {
            if (k.startsWith(`${x0}_${z0}_`) && k !== key) {
              const obj = chunkMap.get(k);
              scene.remove(obj.mesh); obj.mesh.geometry.dispose();
              const idx = terrainChunks.indexOf(obj.mesh); if (idx >= 0) terrainChunks.splice(idx, 1);
              chunkMap.delete(k);
            }
          }
          if (!chunkMap.has(key)) {
            const mesh = buildChunkMeshLOD(x0, z0, step, currentHeightScale);
            scene.add(mesh);
            terrainChunks.push(mesh);
            chunkMap.set(key, { mesh, x0, z0, step });
          }
        }
      }
      // Remove chunks no longer needed
      for (const [k, obj] of Array.from(chunkMap.entries())) {
        if (!needed.has(k)) {
          scene.remove(obj.mesh); obj.mesh.geometry.dispose();
          const idx = terrainChunks.indexOf(obj.mesh); if (idx >= 0) terrainChunks.splice(idx, 1);
          chunkMap.delete(k);
        }
      }
      updateChunkVisibility();
    }

    function rebuildTerrain(scale) {
      if (streamingEnabled) { resetStreaming(scale); return; }
      clearTerrain();
      const built = buildTerrain(worldData, scale);
      lastMinH = built.minH; lastHRange = built.hRange;
      terrainChunks = built.chunks;
      for (const m of terrainChunks) scene.add(m);
      waterMesh = built.water; if (waterMesh) scene.add(waterMesh);
      applyToggles();
    }

    // Raycaster for click-to-inspect
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const hud = document.getElementById('hud');
    // Selection marker
    const marker = new THREE.Mesh(
      new THREE.SphereGeometry(0.35, 16, 16),
      new THREE.MeshBasicMaterial({ color: '#ffffff' })
    );
    marker.visible = false;
    scene.add(marker);

    // Ring marker (flat on terrain)
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(0.6, 0.8, 32),
      new THREE.MeshBasicMaterial({ color: '#00ff88', transparent: true, opacity: 0.8, side: THREE.DoubleSide })
    );
    ring.rotation.x = -Math.PI / 2; // lay flat on XZ
    ring.visible = false;
    scene.add(ring);

    function inspectAt(x, y) {
      mouse.x = (x / renderer.domElement.clientWidth) * 2 - 1;
      mouse.y = -(y / renderer.domElement.clientHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const targets = [...terrainChunks];
      if (waterMesh) targets.push(waterMesh);
      const hits = raycaster.intersectObjects(targets, false);
      if (!hits.length) return;
      const pt = hits[0].point;
      // Map world x,z -> grid
      const gx = Math.round(pt.x + (worldData.width - 1) / 2);
      const gz = Math.round(pt.z + (worldData.depth - 1) / 2);
      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
      const X = clamp(gx, 0, worldData.width - 1);
      const Z = clamp(gz, 0, worldData.depth - 1);
      const idx = Z * worldData.width + X;
      const h = worldData.heights[idx];
      const t = worldData.types[idx];
      const names = ['Air','Stone','Grass','Water','Tree'];
      hud.innerHTML = `<strong>Inspect</strong><br/>x: ${X}, z: ${Z}<br/>height: ${h}<br/>type: ${names[t]||'Unknown'}`;

      const scale = parseFloat(heightScaleEl.value);
      const yWorld = ((h - lastMinH) / Math.max(1, lastHRange)) * 50 * scale + 0.35;
      const halfX = (worldData.width - 1) / 2;
      const halfZ = (worldData.depth - 1) / 2;
      marker.position.set(X - halfX, yWorld, Z - halfZ);
      marker.visible = true;
      ring.position.set(X - halfX, yWorld - 0.2, Z - halfZ);
      ring.visible = true;
    }

    renderer.domElement.addEventListener('click', (e) => {
      inspectAt(e.offsetX, e.offsetY);
    });

    async function load() {
      const res = await fetch('world_surface.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('Failed to load world_surface.json');
      const data = await res.json();
      // Flatten arrays if they are written with newlines; our writer outputs flat arrays separated by commas per line
      data.heights = data.heights; // already flat by writer
      data.types = data.types;

      worldData = data;
      // Try to load a real texture pack; fallback to procedural if not found
      try { TEX_PACK = await tryLoadPBRTextures(); } catch { TEX_PACK = null; }
      rebuildTerrain(parseFloat(heightScaleEl.value));

      // Frame camera to mesh
      const box = new THREE.Box3();
      for (const m of terrainChunks) box.expandByObject(m);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      controls.target.copy(center);
      camera.position.set(center.x + size.x * 0.8, size.y * 1.6 + 40, center.z + size.z * 0.8);
      controls.update();
    }

    heightScaleEl.addEventListener('input', () => {
      const v = parseFloat(heightScaleEl.value);
      heightScaleVal.textContent = `${v.toFixed(1)}×`;
      currentHeightScale = v;
      if (!worldData) return;
      if (streamingEnabled) resetStreaming(v); else rebuildTerrain(v);
    });

    // Keyboard navigation (WASD / Arrow keys) pans camera target relative to view
    function panBy(dx, dz) {
      // Compute right and forward vectors in XZ plane from camera
      const toTarget = new THREE.Vector3().subVectors(controls.target, camera.position).setY(0).normalize();
      if (toTarget.lengthSq() === 0) toTarget.set(0,0,-1);
      const right = new THREE.Vector3().crossVectors(toTarget, new THREE.Vector3(0,1,0)).normalize();
      const move = new THREE.Vector3();
      move.addScaledVector(right, dx);
      move.addScaledVector(toTarget, dz);
      controls.target.add(move);
      camera.position.add(move);
      controls.update();
    }

    window.addEventListener('keydown', (e) => {
      const fast = e.shiftKey ? 4 : 1;
      const step = 0.8 * fast;
      switch (e.key) {
        case 'ArrowLeft': case 'a': case 'A': panBy(-step, 0); break;
        case 'ArrowRight': case 'd': case 'D': panBy(step, 0); break;
        case 'ArrowUp': case 'w': case 'W': panBy(0, -step); break;
        case 'ArrowDown': case 's': case 'S': panBy(0, step); break;
        default: break;
      }
    });

    function frameCameraToTerrain() {
      const box = new THREE.Box3();
      for (const m of terrainChunks) box.expandByObject(m);
      if (waterMesh) box.expandByObject(waterMesh);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      controls.target.copy(center);
      camera.position.set(center.x + size.x * 0.8, size.y * 1.6 + 40, center.z + size.z * 0.8);
      controls.update();
    }

    function applyToggles() {
      // Fog
      scene.fog = toggleFogEl.checked ? defaultFog : null;
      // Grid
      grid.visible = toggleGridEl.checked;
      // Water
      if (waterMesh) waterMesh.visible = toggleWaterEl.checked;
    }

    function updateChunkVisibility() {
      const maxDist = parseFloat(drawDistEl.value || '800');
      const center = controls.target;
      for (const m of terrainChunks) {
        const bs = m.geometry.boundingSphere;
        if (!bs) { m.visible = true; continue; }
        // Compute world-space center (meshes are already in world positions)
        const dx = bs.center.x - center.x;
        const dz = bs.center.z - center.z;
        const dist = Math.hypot(dx, dz);
        m.visible = (dist - bs.radius) <= maxDist;
      }
    }

    toggleFogEl.addEventListener('change', applyToggles);
    toggleGridEl.addEventListener('change', applyToggles);
    toggleWaterEl.addEventListener('change', applyToggles);
    mergedWaterEl.addEventListener('change', () => {
      if (!worldData) return;
      const v = parseFloat(heightScaleEl.value);
      if (streamingEnabled) resetStreaming(v); else rebuildTerrain(v);
    });
    resetCameraEl.addEventListener('click', frameCameraToTerrain);

    toggleStreamingEl.addEventListener('change', () => {
      streamingEnabled = !!toggleStreamingEl.checked;
      if (!worldData) return;
      const v = parseFloat(heightScaleEl.value);
      if (streamingEnabled) resetStreaming(v); else rebuildTerrain(v);
    });

    drawDistEl.addEventListener('input', () => {
      drawDistValEl.textContent = String(drawDistEl.value);
      updateChunkVisibility();
    });

    wireframeEl.addEventListener('change', () => {
      if (terrainMaterial) terrainMaterial.wireframe = !!wireframeEl.checked;
    });

    function applyVisualizationMode(mode) {
      for (const m of terrainChunks) {
        const geom = m.geometry;
        const normals = geom.getAttribute('normal');
        const colors = geom.getAttribute('color');
        const hbuf = m.userData.hbuf, tbuf = m.userData.tbuf;
        if (!normals || !colors || !hbuf || !tbuf) continue;
        // Determine vertex count: supports both static (cw*cd) and streaming LOD (NX*NZ)
        const cw = (m.userData.cw|0) || (m.userData.NX|0);
        const cd = (m.userData.cd|0) || (m.userData.NZ|0);
        const vertCount = cw * cd;
        if (!vertCount) continue;
        const smoothstep = (a,b,x) => {
          const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
          return t * t * (3 - 2 * t);
        };
        for (let vi = 0; vi < vertCount; vi++) {
          const ny = Math.max(0, Math.min(1, normals.getY(vi)));
          const slope = 1.0 - ny;
          const vt = tbuf[vi] | 0;
          const h = hbuf[vi];
          let col = COLORS[vt] || COLORS[0];
          if (mode === 'slope') {
            const w = slope;
            col = new THREE.Color(1.0, 1.0 - 0.6*w, 0.2);
          } else if (mode === 'biomes') {
            if (vt === 2) col = new THREE.Color('#47e18f');
            else if (vt === 1) col = new THREE.Color('#a0a0a0');
            else if (vt === 3) col = new THREE.Color('#46c8ff');
            else if (vt === 4) col = new THREE.Color('#ffaa44');
          } else {
            if (vt === 2 || vt === 1) {
              const g = COLORS[2], s = COLORS[1];
              const w = smoothstep(0.25, 0.9, slope);
              col = new THREE.Color(
                g.r * (1 - w) + s.r * w,
                g.g * (1 - w) + s.g * w,
                g.b * (1 - w) + s.b * w
              );
            }
          }
          const n = 0.06 * Math.sin(h * 0.35) + 0.04 * Math.cos(h * 0.21);
          colors.setX(vi, Math.min(1, Math.max(0, col.r + n)));
          colors.setY(vi, Math.min(1, Math.max(0, col.g + n)));
          colors.setZ(vi, Math.min(1, Math.max(0, col.b + n)));
        }
        colors.needsUpdate = true;
      }
    }
    vizModeEl.addEventListener('change', () => {
      const mode = vizModeEl.value;
      applyVisualizationMode(mode);
    });

    savePNGEl.addEventListener('click', () => {
      const url = renderer.domElement.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url;
      a.download = 'voxelvk_screenshot.png';
      a.click();
    });

    // FPS counter
    let frames = 0; let last = performance.now();

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Main loop
    renderer.setAnimationLoop(() => {
      controls.update();
      const _now = performance.now();
      if (waterUniforms) waterUniforms.uTime.value = _now / 1000;
      // Scroll water normal map for subtle motion
      WATER_NORM_TEX.offset.x = (_now * 0.0002) % 1.0;
      WATER_NORM_TEX.offset.y = (_now * 0.00015) % 1.0;
      if (streamingEnabled) updateStreaming();
      updateChunkVisibility();
      renderer.render(scene, camera);
      // FPS
      frames++;
      const now = performance.now();
      if (now - last >= 1000) {
        const fps = Math.round((frames * 1000) / (now - last));
        fpsEl.textContent = String(fps);
        frames = 0; last = now;
      }
    });

    load().catch(err => {
      console.error(err);
      const div = document.createElement('div');
      div.className = 'hint';
      div.style.position = 'fixed';
      div.style.bottom = '12px';
      div.style.left = '12px';
      div.textContent = 'Could not load world_surface.json - run ./world_visualizer first';
      document.body.appendChild(div);
    });
  </script>
</body>
</html>
